      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [modelProfileIds], properties: { modelProfileIds: { type: array, items: { type: string, format: uuid } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [modelProfileId, displayName, ok]
                  properties:
                    modelProfileId: { type: string, format: uuid }
                    displayName: { type: string }
                    ok: { type: boolean }
                    latencyMs: { type: integer, format: int64 }
                    error: { type: string, nullable: true }
