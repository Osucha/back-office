    put:
      tags: [my-work]
      operationId: updateMyIntakeRule
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeRuleInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [my-work]
      operationId: deleteMyIntakeRule
      description: Deletes the rule and its open (NEW, DISMISSED, BASELINE) proposals; started proposals keep their run.
      responses:
        '204': { description: Deleted }
  /me/intake/rules/{ruleId}/poll:
    parameters: [ { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [my-work]
      operationId: pollMyIntakeRule
      description: Schedules a poll of the rule right away.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeRule' } } } }
  /me/intake/proposals:
    get:
      tags: [my-work]
      operationId: listMyIntakeProposals
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [NEW, STARTED, DISMISSED] }, description: 'default NEW' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IntakeProposal' } } } } }
  /me/intake/proposals/{proposalId}/start:
    parameters: [ { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [my-work]
      operationId: startMyIntakeProposal
      description: Starts the rule's default workflow (or `workflowId`) for the issue as the caller (`run.start` on its project).
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { workflowId: { type: string, format: uuid, nullable: true } } } } } }
      responses:
        '200': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeProposal' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /me/intake/proposals/{proposalId}/dismiss:
    parameters: [ { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [my-work]
      operationId: dismissMyIntakeProposal
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeProposal' } } } }
  /me/intake/proposals/{proposalId}/restore:
    parameters: [ { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [my-work]
      operationId: restoreMyIntakeProposal
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeProposal' } } } }
  /me/connections:
    get:
      tags: [connections]
      operationId: listMyConnections
      description: >
        ADR 0035: the caller's personal connections (needs `connections.personal`; people only, not CI tokens). A personal
        connection is used only with its owner's action (approving a write, starting a run) and is never readable by others.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [connections]
      operationId: createMyConnection
      description: Needs `connections.personal`. Verified on save; audited `CONNECTION_CREATE` (scope USER).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /me/connections/test:
    post:
      tags: [connections]
      operationId: testMyConnection
      description: '"Test before saving" for a personal connection; nothing is stored. Audited `CONNECTION_TEST`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /me/connections/{connectionId}:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    get:
      tags: [connections]
      operationId: getMyConnection
      description: Only the owner; any other caller gets 404.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [connections]
      operationId: updateMyConnection
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [connections]
      operationId: deleteMyConnection
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /me/connections/{connectionId}/secret:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    put:
      tags: [connections]
      operationId: rotateMyConnectionSecret
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionSecretInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
  /me/connections/{connectionId}/verify:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    post:
      tags: [connections]
      operationId: verifyMyConnection
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerifyRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
  /admin/connections/personal:
    get:
      tags: [connections]
      operationId: listPersonalConnections
      description: >
        Needs `admin.connections.manage`. Metadata of every personal connection (name, site, capabilities, owner, expiry,
        last verification) for audit; administrators can neither use nor change them, and the account e-mail is not shown.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonalConnectionSummary' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/jira-connections:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [connections]
      operationId: getProjectJiraConnections
      description: >
        ADR 0035 (`project.view`): the project's system connection (default of every Jira step) and the ordered list of
        further connections, with the project and platform connections that can be chosen. Personal connections never.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectJiraConnections' } } } }
    put:
      tags: [connections]
      operationId: updateProjectJiraConnections
      description: Needs `project.connections.manage`. Audited `PROJECT_JIRA_CONNECTIONS_UPDATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectJiraConnectionsInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectJiraConnections' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/connections:
    get:
      tags: [connections]
      operationId: listPlatformConnections
      description: >
        Platform connections (needs `integrations.view`), followed by the legacy environment-variable Jira
        credential (`legacy: true`, read-only, all capabilities) when `JIRA_URL` / `JIRA_EMAIL` / `JIRA_API_TOKEN`
        are set. Secrets are never returned.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
    post:
      tags: [connections]
      operationId: createPlatformConnection
      description: Needs `admin.connections.manage`. The secret is encrypted at rest; the connection is verified against Jira on save (a failed verification does not prevent saving). Audited `CONNECTION_CREATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/connections/{connectionId}:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    get:
      tags: [connections]
      operationId: getPlatformConnection
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
    put:
      tags: [connections]
      operationId: updatePlatformConnection
      description: Needs `admin.connections.manage`. Omitting `secret` keeps the stored one. Re-verified on save. Audited `CONNECTION_UPDATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [connections]
      operationId: deletePlatformConnection
      description: Needs `admin.connections.manage`. Audited `CONNECTION_DELETE`.
      responses:
        '204': { description: Deleted }
  /admin/connections/{connectionId}/secret:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    put:
      tags: [connections]
      operationId: rotatePlatformConnectionSecret
      description: Replaces the secret (rotation). Needs `admin.connections.manage`. Re-verified. Audited `CONNECTION_ROTATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionSecretInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
  /admin/connections/test:
    post:
      tags: [connections]
      operationId: testPlatformConnectionDraft
      description: >
        "Test before saving": verifies a draft against Jira (`myself` + `mypermissions`) without storing anything. The secret
        is sealed in memory only; without a secret the stored one of `connectionId` is used (editing). Needs
        `admin.connections.manage`. Audited `CONNECTION_TEST` (never with the secret).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/connections/{connectionId}/verify:
    parameters: [ { $ref: '#/components/parameters/connectionId' } ]
    post:
      tags: [connections]
      operationId: verifyPlatformConnection
      description: >
        Calls Jira `GET /rest/api/3/myself` and `GET /rest/api/3/mypermissions` for every allowed project key (or the
        given sample key) and stores the result. Needs `admin.connections.manage`. Audited `CONNECTION_VERIFY`. For the
        legacy connection the result is returned but not stored.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerifyRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
  /projects/{projectId}/connections:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [connections]
      operationId: listProjectConnections
      description: Connections of this project (needs `project.view`). Secrets are never returned.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
    post:
      tags: [connections]
      operationId: createProjectConnection
      description: Needs `project.connections.manage` (project owners). Verified on save. Audited `CONNECTION_CREATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/connections/test:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [connections]
      operationId: testProjectConnectionDraft
      description: '"Test before saving" for a project connection draft; needs `project.connections.manage`. Nothing is stored. Audited `CONNECTION_TEST`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /connections/expiring:
    get:
      tags: [connections]
      operationId: listExpiringConnections
      description: >
        Connections whose token expires within 14 days (or has expired) that the caller may manage: platform ones with
        `admin.connections.manage`, project ones with `project.connections.manage`. Feeds the "Your turn" reminder; the
        daily reminder job also publishes `ConnectionExpiring` once per expiry date.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
  /projects/{projectId}/jira-intake:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [jira-intake]
      operationId: getJiraIntake
      description: The project's Jira intake watcher (ADR 0033) with its status and the ISSUE_READ connection it would use. Needs `project.view`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/JiraIntake' } } } }
    put:
      tags: [jira-intake]
      operationId: updateJiraIntake
      description: >
        Configures the watcher. Needs `project.manage`. Enabling needs a workflow of this project with a `JIRA_TRANSITION`
        trigger (status = the status that starts a run; empty = new issues). Enabling or changing the workflow resets the
        cursor: the first poll only takes a baseline. Audited `JIRA_INTAKE_UPDATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JiraIntakeInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/JiraIntake' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/jira-intake/poll:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [jira-intake]
      operationId: pollJiraIntakeNow
      description: '"Poll now": schedules a poll right away (a worker performs it). Needs `project.manage` and an enabled watcher. Audited `JIRA_INTAKE_POLL_NOW`.'
      responses:
        '202': { description: Scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/JiraIntake' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/connections/usable:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [connections]
      operationId: listUsableConnections
      description: Every connection a run of this project may use, in selection order (project connections, then platform ones, then the legacy credential). Needs `project.view`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connection' } } } } }
  /projects/{projectId}/connections/resolve:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: capabilities, in: query, required: true, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/ConnectionCapability' } } }
      - { name: connectionId, in: query, required: false, description: a pinned connection (node config `jiraConnection`), schema: { type: string, format: uuid } }
      - { name: jiraProjectKey, in: query, required: false, description: 'Jira project the step works on; default: the project''s Jira project key', schema: { type: string } }
    get:
      tags: [connections]
      operationId: resolveConnection
      description: The connection a step needing `capabilities` would use (least-privilege selection, ADR 0030). Needs `project.view`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionResolution' } } } }
  /projects/{projectId}/connections/{connectionId}:
    parameters: [ { $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/connectionId' } ]
    get:
      tags: [connections]
      operationId: getProjectConnection
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
    put:
      tags: [connections]
      operationId: updateProjectConnection
      description: Needs `project.connections.manage`. Omitting `secret` keeps the stored one. Audited `CONNECTION_UPDATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [connections]
      operationId: deleteProjectConnection
      description: Needs `project.connections.manage`. Audited `CONNECTION_DELETE`.
      responses:
        '204': { description: Deleted }
  /projects/{projectId}/connections/{connectionId}/secret:
    parameters: [ { $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/connectionId' } ]
    put:
      tags: [connections]
      operationId: rotateProjectConnectionSecret
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionSecretInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
  /projects/{projectId}/connections/{connectionId}/verify:
    parameters: [ { $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/connectionId' } ]
    post:
      tags: [connections]
      operationId: verifyProjectConnection
      description: Needs `project.connections.manage`. Audited `CONNECTION_VERIFY`.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionVerifyRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }

  /projects/{projectId}/scm-connections:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [connections]
      operationId: listScmConnections
      description: ADR 0051. Tokens of this project's repositories (needs `project.view`). Tokens are never returned.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScmConnection' } } } } }
    post:
      tags: [connections]
      operationId: createScmConnection
      description: Needs `project.connections.manage` (project owners). `token` is required; it is tested against the SCM before it is stored (a failed test is stored, it does not block the save). Audited `SCM_CONNECTION_CREATE`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnectionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/scm-connections/test:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [connections]
      operationId: testScmConnectionDraft
      description: '"Test before saving": needs `project.connections.manage` and `token`. Read-only calls to the repository host; nothing is stored. Audited `SCM_CONNECTION_TEST`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnectionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScmVerification' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/scm-connections/{scmConnectionId}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: scmConnectionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [connections]
      operationId: updateScmConnection
      description: Needs `project.connections.manage`. Omitting `token` keeps the stored one (audited `SCM_CONNECTION_UPDATE`); a new `token` replaces it (`SCM_CONNECTION_ROTATE`). Tested again either way.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnectionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [connections]
      operationId: deleteScmConnection
      description: Needs `project.connections.manage`. Audited `SCM_CONNECTION_DELETE`.
      responses:
        '204': { description: Deleted }
  /projects/{projectId}/scm-connections/{scmConnectionId}/verify:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: scmConnectionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [connections]
      operationId: verifyScmConnection
      description: Tests the stored token again (needs `project.connections.manage`); 409 when its repository is no longer part of the project. Audited `SCM_CONNECTION_VERIFY`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScmConnection' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      description: Server-sent events; `event:` is the type, `data:` is a `DomainEventEnvelope`. Authenticated by the session cookie; events are filtered to projects the caller can view (`project.view`). Supports `Last-Event-ID` / `?lastEventId=`.
      responses:
        '200': { description: SSE stream, content: { text/event-stream: { schema: { $ref: '#/components/schemas/DomainEventEnvelope' } } } }

  /internal/runner/jobs/{jobId}/events:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-internal]
      operationId: postRunnerEvents
      security: [ { RunnerToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RunnerEvent' } } } } }
      responses:
        '202': { description: Accepted }
  /internal/runner/jobs/{jobId}/result:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-internal]
      operationId: postRunnerResult
      security: [ { RunnerToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerResult' } } } }
      responses:
        '202': { description: Accepted }
        '409': { $ref: '#/components/responses/Problem' }
  /internal/runner/jobs/{jobId}/agent-token:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-internal]
      operationId: issueRunnerAgentToken
      summary: Gateway-only token for the coding agent (ADR 0029)
      description: >-
        Called by the runner entrypoint with the full job token before it starts the coding agent. The returned
        `bo_job_` token is accepted by the LLM proxy only; events, result and uploads refuse it (401), so a
        prompt-injected agent cannot post or forge the job result. Once per lease; a new lease or the end of the
        job invalidates it.
      security: [ { RunnerToken: [] } ]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, scope]
                properties:
                  token: { type: string, description: 'bo_job_... (gateway-only)' }
                  scope: { type: string, enum: [GATEWAY] }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    Session: { type: apiKey, in: cookie, name: BO_SESSION, description: 'Set by the OIDC login; unsafe methods also need header X-XSRF-TOKEN = cookie XSRF-TOKEN' }
    PersonalToken: { type: http, scheme: bearer, description: 'Personal access token `bo_pat_...`' }
    CiToken: { type: http, scheme: bearer, description: 'Project CI token `bo_ci_...` issued in Project → Settings' }
    RunnerToken: { type: http, scheme: bearer, description: 'Per-job token `bo_job_` (sandbox): runner callbacks, uploads and the LLM proxy; the gateway-only agent token reaches the LLM proxy only' }
    RunnerFleetToken: { type: http, scheme: bearer, description: 'runner-controller token `bo_rt_` issued at registration' }

  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    workflowId: { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
    libraryWorkflowId: { name: libraryWorkflowId, in: path, required: true, schema: { type: string, format: uuid } }
    runId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    userId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    groupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    connectionId: { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    key: { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
    page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }

  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, default: USD }
    TokenUsage:
      type: object
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
    Provider:
      type: string
      enum: [ANTHROPIC, OPENAI, GOOGLE, MISTRAL, OLLAMA, OPENAI_COMPATIBLE]
    Reasoning:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH, XHIGH, MAX]
    ModelOptions:
      type: object
      properties:
        temperature: { type: number, nullable: true }
        maxOutputTokens: { type: integer, nullable: true }
        reasoning: { $ref: '#/components/schemas/Reasoning' }
        extra: { type: object, additionalProperties: true }
    ModelRef:
      type: object
      required: [provider, modelId]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        modelId: { type: string }
        options: { $ref: '#/components/schemas/ModelOptions' }
        connection:
          type: string
          nullable: true
          description: 'ADR 0045: key of the LLM provider connection serving the model; null = the first connection of the provider, else its environment configuration'
    LlmProviderInput:
      type: object
      description: >-
        ADR 0045: an LLM provider connection added in Back Office. Several per provider type are possible (e.g. OpenRouter
        and Groq as OPENAI_COMPATIBLE). Key and provider cannot change. apiKey is write-only: null keeps the stored key,
        clearApiKey removes it. Needs BACKOFFICE_SECRETS_KEY on the server to store a key.
      required: [key, name, provider]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
        name: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        baseUrl: { type: string, nullable: true, description: 'required for OPENAI_COMPATIBLE (including the version path, e.g. https://openrouter.ai/api/v1) and OLLAMA; optional override for the others' }
        apiKey: { type: string, nullable: true, writeOnly: true }
        clearApiKey: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        requestsPerMinute: { type: integer, minimum: 1, nullable: true, description: 'ADR 0046: limit Back Office keeps for this connection (null = none)' }
        requestsPerDay: { type: integer, minimum: 1, nullable: true, description: 'ADR 0046: per UTC day; e.g. 50 for OpenRouter free models without credits' }
        personal:
          type: boolean
          default: false
          description: >-
            ADR 0050 step 2b: the caller's own connection (their API key), created with models.view instead of
            admin.settings.manage. Only its owner sees, changes and uses it (in personal profiles, for their own runs,
            benchmarks and tests); a model without a named connection never falls back to it. Set on create only.
    LlmProvider:
      type: object
      required: [name, provider, hasApiKey, enabled, usable, source]
      properties:
        id: { type: string, format: uuid, nullable: true, description: 'null for an environment endpoint' }
        key: { type: string, nullable: true }
        name: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        baseUrl: { type: string, nullable: true }
        hasApiKey: { type: boolean }
        enabled: { type: boolean }
        usable: { type: boolean, description: 'enabled, with what its type needs and a readable key' }
        source: { type: string, enum: [DATABASE, ENVIRONMENT], description: 'ENVIRONMENT = read-only fallback from environment variables' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], nullable: true }
        requestsPerMinute: { type: integer, nullable: true }
        requestsPerDay: { type: integer, nullable: true }
        requestsToday: { type: integer, nullable: true, description: 'requests sent through the connection today (UTC)' }
        personal: { type: boolean, description: 'ADR 0050 step 2b: the caller''s own connection' }
    ProviderModels:
      type: object
      required: [ok, models]
      properties:
        ok: { type: boolean }
        models: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        details: { type: array, items: { $ref: '#/components/schemas/ProviderModelInfo' } }
    ProviderModelInfo:
      type: object
      required: [id, free]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        contextWindow: { type: integer, nullable: true }
        inputPerMTok: { type: number, nullable: true, description: 'USD per million input tokens, when the provider publishes it (OpenRouter)' }
        outputPerMTok: { type: number, nullable: true }
        free: { type: boolean, description: 'a :free model, zero prices, or a local Ollama model' }
    ProviderCatalogSection:
      type: object
      required: [name, provider, source, ok, models]
      properties:
        connection: { type: string, nullable: true, description: 'connection key; null for an environment endpoint' }
        name: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        source: { type: string, enum: [DATABASE, ENVIRONMENT] }
        ok: { type: boolean }
        error: { type: string, nullable: true }
        models: { type: array, items: { $ref: '#/components/schemas/ProviderModelInfo' } }
        personal: { type: boolean, description: 'ADR 0050 step 2b: the caller''s own connection; profiles of its models are personal' }

    Dashboard:
      type: object
      properties:
        openApprovals: { type: integer }
        activeRuns: { type: integer }
        waitingForCi: { type: integer }
        runningBenchmarks: { type: integer }
        failedRunsLast7Days: { type: integer }
        costThisMonth: { $ref: '#/components/schemas/Money' }
        costLast30DaysByDay: { type: array, items: { type: object, properties: { day: { type: string, format: date }, cost: { $ref: '#/components/schemas/Money' } } } }
        recentRuns: { type: array, items: { $ref: '#/components/schemas/WorkflowRunSummary' } }
        recentCiExecutions: { type: array, items: { $ref: '#/components/schemas/CiExecutionSummary' } }
        pendingApprovals: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }

    # ---- projects
    RepositoryPurpose:
      type: string
      enum: [DOCS, SOURCE, OTHER, STANDARDS, TEMPLATES]
      description: 'What a repository holds (ADR 0034, ADR 0043); shown as a label and in the agent prompt. DOCS = documentation, SOURCE = source code, STANDARDS = rules to follow, TEMPLATES = templates to start from.'
    ProjectRepository:
      type: object
      description: >-
        One git repository of a project (ADR 0034). A project has zero or more; steps that need repositories name
        them by `key` (node config `repositories`), otherwise they use the `primary` one. No SCM API is involved
        (ADR 0013): the runner clones and pushes with credentials of its own cluster (ADR 0031).
      required: [key, url]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}$', description: 'unique in the project; also the workspace directory /workspace/<key>', example: docs }
        url: { type: string, description: 'git URL the runner clones (and, for PUSH_MR steps, pushes to)' }
        defaultBranch: { type: string, default: main, description: 'base branch of jobs and target of merge requests; never pushed to' }
        purpose: { $ref: '#/components/schemas/RepositoryPurpose' }
        description: { type: string, nullable: true }
        primary: { type: boolean, default: false, description: 'at most one; the repository of steps that name none' }
    ProjectInput:
      type: object
      required: [name]
      properties:
        key: { type: string, nullable: true, pattern: '^([A-Z][A-Z0-9_]{1,15})?$', description: "Back Office's short code of the project (CI logins, MCP, templates); not a Jira key. Omitted on create = generated from the name; on update a new value renames the project, omitted = unchanged." }
        name: { type: string }
        description: { type: string }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/ProjectRepository' }
          description: >-
            The project's git repositories, in display order (ADR 0034). Optional: a project without repositories runs
            LLM work only (no coding steps). Keys are unique, at most one is `primary`.
        repository:
          type: object
          nullable: true
          deprecated: true
          description: >-
            Deprecated (one release, ADR 0034). In responses: the primary repository (null when there is none). In
            requests: used only when `repositories` is absent; becomes the single repository `main` (SOURCE, primary).
          required: [url]
          properties:
            url: { type: string, description: 'git URL the runner clones and pushes to' }
            defaultBranch: { type: string, default: main }
        issueTracker:
          type: object
          nullable: true
          properties:
            jiraProjectKey: { type: string, description: "Jira project of the issues (e.g. LFV); not derived from the project key" }
            jql: { type: string, nullable: true }
        constitution: { type: string, description: 'Markdown, Spec Kit constitution (kept while Spec Kit is off, ADR 0036)' }
        specKit: { type: boolean, nullable: true, description: 'ADR 0036: Spec Kit for this project (off by default for new projects; null on update = unchanged). Used only when the platform allows Spec Kit.' }
        personal: { type: boolean, description: 'ADR 0038 (default false): a private project of its creator only (needs `projects.create.personal` or `projects.create`); members cannot be added. Set at creation, ignored on update.' }
        defaults:
          type: object
          properties:
            modelProfileId: { type: string, format: uuid, nullable: true }
            reviewModelProfileId: { type: string, format: uuid, nullable: true }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectInput'
        - type: object
          required: [id, key, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            key: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,15}$' }
            ciEntrypoints: { type: array, items: { $ref: '#/components/schemas/CiEntrypoint' } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            createdBy: { $ref: '#/components/schemas/ActorRef' }
            myRoles: { type: array, items: { type: string }, readOnly: true, description: "caller's project roles" }
            myPermissions: { type: array, items: { type: string }, readOnly: true, description: "caller's effective project permissions" }
            stats:
              type: object
              properties:
                workflows: { type: integer }
                activeRuns: { type: integer }
                openApprovals: { type: integer }
                ciExecutionsLast7Days: { type: integer }
                costLast30Days: { $ref: '#/components/schemas/Money' }
    CiEntrypoint:
      type: object
      required: [key, workflowId, mode]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$', example: code-review }
        workflowId: { type: string, format: uuid }
        workflowName: { type: string, readOnly: true }
        mode: { type: string, enum: [BLOCKING, ADVISORY], default: BLOCKING }
        description: { type: string, nullable: true }
        uploadDiff: { type: boolean, default: true }
        repository: { type: string, nullable: true, description: 'optional key of a project repository: only CI jobs of that repository may start this entrypoint (ADR 0034)' }
    CiToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: first 12 characters for display }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/ActorRef' }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    CiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/CiToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: 'plaintext, shown once' }

    # ---- workflows
    NodeKind:
      type: string
      enum: [START, END, TASK, DECISION, HUMAN_GATE, WAIT_FOR_CI, NOTE]
    Point:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }
    TaskOverrides:
      type: object
      properties:
        modelProfileId: { type: string, format: uuid, nullable: true }
        systemPromptAppend: { type: string, nullable: true }
        promptAppend: { type: string, nullable: true }
        promptReplace: { type: string, nullable: true }
        addSkills: { type: array, items: { type: string } }
        removeSkills: { type: array, items: { type: string } }
        config: { type: object, additionalProperties: true }
    DecisionBranch:
      type: object
      required: [id, label, expression]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        label: { type: string }
        expression: { type: string, description: 'SpEL boolean over WorkflowStateView, e.g. confidence >= 0.8' }
    WorkflowNode:
      type: object
      required: [id, kind, name, position]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        kind: { $ref: '#/components/schemas/NodeKind' }
        name: { type: string }
        position: { $ref: '#/components/schemas/Point' }
        timeoutSeconds: { type: integer, nullable: true }
        maxVisits: { type: integer, default: 3, description: loop guard }
        task:
          type: object
          nullable: true
          required: [templateKey]
          properties:
            templateKey: { type: string }
            overrides: { $ref: '#/components/schemas/TaskOverrides' }
        decision:
          type: object
          nullable: true
          required: [branches]
          properties:
            branches: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DecisionBranch' } }
            defaultBranch: { type: string, nullable: true, description: branch id taken when no expression is true; omitted = run fails }
        gate:
          type: object
          nullable: true
          required: [question]
          properties:
            question: { type: string, description: template }
            options: { type: array, items: { type: string }, default: [approve, revise, reject] }
            showArtifacts: { type: array, items: { type: string } }
            timeoutSeconds: { type: integer, nullable: true }
            approvers: { $ref: '#/components/schemas/GateApprovers' }
            checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' }, description: 'Definition of Ready/Done items; approve needs all required ones ticked' }
        ci:
          type: object
          nullable: true
          required: [signal]
          properties:
            signal: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$', example: tests }
            timeoutSeconds: { type: integer, nullable: true }
            watchPipeline: { type: boolean, nullable: true, description: 'ADR 0052: Back Office watches the pipeline of the run''s branch itself with the project''s CI_READ token and delivers the signal when it finished; a failure passes the failed jobs and their log tails to the next step as feedback' }
            repository: { type: string, nullable: true, description: repository key whose pipeline is watched; omitted = the primary repository }
        end:
          type: object
          nullable: true
          required: [outcome]
          properties:
            outcome: { type: string, enum: [SUCCESS, FAILURE] }
        note:
          type: object
          nullable: true
          properties: { text: { type: string } }
    WorkflowEdge:
      type: object
      required: [id, from, fromPort, to]
      properties:
        id: { type: string }
        from: { type: string }
        fromPort: { type: string, example: success }
        to: { type: string }
        label: { type: string, nullable: true }
    Trigger:
      type: object
      required: [type]
      description: >
        JIRA_TRANSITION is used by the project's Jira intake watcher (ADR 0033): with `status`, an issue entering that status
        starts a run with its `issueKey`; without, a new issue matching the project's JQL does.
      properties:
        type: { type: string, enum: [MANUAL, JIRA_TRANSITION, API, CI] }
        status: { type: string, nullable: true }
    WorkflowDefinitionInput:
      type: object
      required: [name, nodes, edges]
      properties:
        name: { type: string }
        description: { type: string }
        nodes: { type: array, minItems: 2, items: { $ref: '#/components/schemas/WorkflowNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/WorkflowEdge' } }
        triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
        enabled: { type: boolean, default: true }
        canvas: { type: object, nullable: true, properties: { zoom: { type: number }, x: { type: number }, y: { type: number } } }
    ProjectWorkspaceInput:
      type: object
      description: >-
        ADR 0044: a run workspace of a project, used by any of its workflows. Coding steps pick it by key
        (config.workspace) and share /workspace within one run; steps without repositories of their own work on its
        sources (the project's primary among them gets the step's push access, the others READ); setupCommand runs once
        per workspace; roles are the agent session roles its steps may continue (any when empty). The key cannot change.
      required: [key]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,19}$' }
        name: { type: string, description: 'shown on the canvas; default the key' }
        description: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: { type: string, description: 'project repository key, or library source key when library is true' }
              library: { type: boolean, default: false }
        setupCommand: { type: string, nullable: true }
        roles: { type: array, items: { type: string, pattern: '^[a-z][a-z0-9-]{0,19}$' } }
    ProjectWorkspace:
      allOf:
        - $ref: '#/components/schemas/ProjectWorkspaceInput'
        - type: object
          required: [id, projectId, name, sources, roles, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], nullable: true }
    WorkflowDefinition:
      allOf:
        - $ref: '#/components/schemas/WorkflowDefinitionInput'
        - type: object
          required: [id, projectId, version]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { $ref: '#/components/schemas/ActorRef' }
            library: { allOf: [ { $ref: '#/components/schemas/LibraryLink' } ], nullable: true, readOnly: true, description: 'set when the workflow is a linked copy of a library workflow (ADR 0037)' }
            draft: { type: boolean, readOnly: true, description: 'saved with validation errors: kept as a draft, no run starts from it and it cannot be published until it is saved without errors' }
    IntakeRuleInput:
      type: object
      required: [name, connectionId, jql, workflowId]
      properties:
        name: { type: string, maxLength: 100 }
        connectionId: { type: string, format: uuid, description: one of the caller's personal connections with ISSUE_READ }
        jql: { type: string, maxLength: 2000, example: 'assignee = currentUser() AND statusCategory != Done' }
        pollIntervalMinutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
        workflowId: { type: string, format: uuid, description: the workflow proposed for new issues }
        enabled: { type: boolean, default: true }
        includeExisting: { type: boolean, default: true, description: 'the issues matching on the first poll become proposals too' }
    IntakeRule:
      allOf:
        - $ref: '#/components/schemas/IntakeRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            connectionName: { type: string, nullable: true }
            workflowName: { type: string, nullable: true }
            projectId: { type: string, format: uuid, nullable: true }
            projectKey: { type: string, nullable: true }
            initialized: { type: boolean, description: the first poll happened }
            lastPollAt: { type: string, format: date-time, nullable: true }
            lastSuccessAt: { type: string, format: date-time, nullable: true }
            nextPollAt: { type: string, format: date-time, nullable: true }
            lastError: { type: string, nullable: true }
            consecutiveFailures: { type: integer }
            newProposals: { type: integer, description: proposals of this rule waiting for a decision }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    IntakeProposal:
      type: object
      required: [id, ruleId, issueKey, state, detectedAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        ruleName: { type: string, nullable: true }
        issueKey: { type: string }
        summary: { type: string, nullable: true, description: 'display only (issue text, untrusted); never sent to a model by the intake' }
        issueType: { type: string, nullable: true }
        status: { type: string, nullable: true, description: Jira status when detected }
        priority: { type: string, nullable: true }
        issueUrl: { type: string, nullable: true }
        state: { type: string, enum: [NEW, STARTED, DISMISSED] }
        detectedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        workflowId: { type: string, format: uuid, nullable: true, description: 'NEW: the rule default; STARTED: the workflow started' }
        workflowName: { type: string, nullable: true }
        runId: { type: string, format: uuid, nullable: true }
    LibraryLink:
      type: object
      required: [libraryWorkflowId, key, name, version, latestVersion, modified, deprecated]
      properties:
        libraryWorkflowId: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        version: { type: integer, description: the library version the copy follows }
        latestVersion: { type: integer, description: 'newer than `version`: an update is available' }
        modified: { type: boolean, description: the graph differs from that version (project-local settings and positions ignored) }
        deprecated: { type: boolean }
    LibraryWorkflowSource:
      type: object
      properties:
        projectId: { type: string, format: uuid, nullable: true }
        projectKey: { type: string, nullable: true }
        workflowId: { type: string, format: uuid, nullable: true }
        workflowVersion: { type: integer, nullable: true }
    LibraryWorkflowVersionSummary:
      type: object
      required: [version, nodeCount, publishedAt]
      properties:
        version: { type: integer }
        changeNote: { type: string }
        nodeCount: { type: integer, description: nodes without notes }
        publishedAt: { type: string, format: date-time }
        publishedBy: { $ref: '#/components/schemas/ActorRef' }
        source: { $ref: '#/components/schemas/LibraryWorkflowSource' }
    LibraryWorkflowSummary:
      type: object
      required: [id, key, name, latestVersion, deprecated, usage]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        latestVersion: { type: integer }
        nodeCount: { type: integer }
        deprecated: { type: boolean }
        usage: { type: object, required: [projects, workflows], properties: { projects: { type: integer }, workflows: { type: integer } }, description: linked project workflows the caller may view }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/ActorRef' }
        latestPublishedAt: { type: string, format: date-time }
    LibraryWorkflowAdoption:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        workflowId: { type: string, format: uuid }
        workflowName: { type: string }
        version: { type: integer }
        modified: { type: boolean }
        enabled: { type: boolean }
    LibrarySourceInput:
      type: object
      required: [key, name, url]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,26}$', description: 'Name steps use; the job clones it into /workspace/lib-<key>' }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [GIT], description: 'Only GIT for now' }
        url: { type: string, description: 'Git clone URL; the runner cluster needs a read credential for private repositories' }
        defaultBranch: { type: string, nullable: true, description: 'Empty = main' }
        purpose: { $ref: '#/components/schemas/RepositoryPurpose' }
    LibrarySource:
      allOf:
        - $ref: '#/components/schemas/LibrarySourceInput'
        - type: object
          required: [id, jobKey, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            jobKey: { type: string, description: 'lib-<key>: the repository key and directory of the source in a job' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], nullable: true }
    LibraryWorkflow:
      allOf:
        - $ref: '#/components/schemas/LibraryWorkflowSummary'
        - type: object
          required: [versions, adoptions]
          properties:
            versions: { type: array, description: newest first, items: { $ref: '#/components/schemas/LibraryWorkflowVersionSummary' } }
            adoptions: { type: array, items: { $ref: '#/components/schemas/LibraryWorkflowAdoption' } }
    LibraryWorkflowVersionDetail:
      allOf:
        - $ref: '#/components/schemas/LibraryWorkflowVersionSummary'
        - type: object
          required: [libraryWorkflowId, key, name, nodes, edges]
          properties:
            libraryWorkflowId: { type: string, format: uuid }
            key: { type: string }
            name: { type: string }
            description: { type: string }
            nodes: { type: array, items: { $ref: '#/components/schemas/WorkflowNode' } }
            edges: { type: array, items: { $ref: '#/components/schemas/WorkflowEdge' } }
            triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
            canvas: { type: object, nullable: true, properties: { zoom: { type: number }, x: { type: number }, y: { type: number } } }
    PublishWorkflowRequest:
      type: object
      properties:
        libraryWorkflowId: { type: string, format: uuid, nullable: true, description: 'null: a new entry (key and name required)' }
        key: { type: string, nullable: true, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        changeNote: { type: string, nullable: true, maxLength: 2000 }
    LibraryWorkflowUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        deprecated: { type: boolean, default: false }
    AdoptLibraryWorkflowRequest:
      type: object
      required: [libraryWorkflowId]
      properties:
        libraryWorkflowId: { type: string, format: uuid }
        version: { type: integer, nullable: true, description: default the latest }
        name: { type: string, nullable: true, description: default the library name (made unique in the project) }
    LibraryUpdateRequest:
      type: object
      properties:
        version: { type: integer, nullable: true, description: default the latest }
        discardLocalChanges: { type: boolean, default: false }
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    ValidationIssue:
      type: object
      required: [message]
      properties:
        nodeId: { type: string, nullable: true }
        edgeId: { type: string, nullable: true }
        field: { type: string, nullable: true }
        message: { type: string }
    ControlNodeDescriptor:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/NodeKind' }
        title: { type: string }
        description: { type: string }
        ports: { type: array, items: { type: string } }
        configSchema: { type: object, additionalProperties: true, description: JSON Schema of the kind-specific section (gate/ci/end/decision) }
    PaletteTask:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        executor: { $ref: '#/components/schemas/TaskExecutor' }
        interfaces: { type: array, items: { type: string } }
        ports: { type: array, items: { type: string } }
        projectScoped: { type: boolean }
        configSchema: { type: object, additionalProperties: true, description: JSON Schema for `overrides.config` derived from the executor }
        requiredCapabilities:
          type: array
          items: { $ref: '#/components/schemas/ConnectionCapability' }
          description: 'Connection capabilities the task needs (Jira tasks); empty for others. A node pins a connection with `overrides.config.jiraConnection` (connection id).'
        externalWrite:
          type: boolean
          description: >
            The task writes to an external system (a required capability is a write). Approval before write applies
            (ADR 0033): node config `overrides.config.approval` REQUIRED (default, also when missing) or NOT_REQUIRED, and
            `overrides.config.approvers` ({projectRoles, users, accountable, forbidSelfApproval}; default owner and maintainer).
    WorkflowPalette:
      type: object
      properties:
        controlNodes: { type: array, items: { $ref: '#/components/schemas/ControlNodeDescriptor' } }
        tasks: { type: array, items: { $ref: '#/components/schemas/PaletteTask' } }
        interfaces: { type: array, items: { $ref: '#/components/schemas/TaskInterface' } }
        stateFields: { type: array, items: { type: object, properties: { path: { type: string }, description: { type: string } } }, description: for the expression editor }

    # ---- runs
    StartRunRequest:
      type: object
      properties:
        issueKey: { type: string, nullable: true }
        parameters: { type: object, additionalProperties: true }
    RunStatus:
      type: string
      enum: [PENDING, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED]
    RunOutcome:
      type: string
      enum: [SUCCESS, FAILURE]
    NodeExecutionStatus:
      type: string
      enum: [RUNNING, WAITING, SUCCEEDED, FAILED, SKIPPED]
    NodeExecution:
      type: object
      properties:
        id: { type: string, format: uuid }
        nodeId: { type: string }
        nodeName: { type: string }
        kind: { $ref: '#/components/schemas/NodeKind' }
        templateKey: { type: string, nullable: true }
        attempt: { type: integer }
        status: { $ref: '#/components/schemas/NodeExecutionStatus' }
        port: { type: string, nullable: true, description: output port taken }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        summary: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        runnerJobId: { type: string, format: uuid, nullable: true }
        usage: { $ref: '#/components/schemas/TokenUsage' }
        cost: { $ref: '#/components/schemas/Money' }
        apiCost: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'ADR 0042: the step at API list prices; equals cost unless a subscription paid for it (Claude Code with its owner login on a personal runner)' }
        error: { type: string, nullable: true }
        artifactIds: { type: array, items: { type: string, format: uuid } }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/RepositoryResult' }
          description: 'per-repository result of a runner step (ADR 0034); empty for steps without repositories'
    RepositoryResult:
      type: object
      description: 'What a runner step did in one repository (ADR 0034). Built from RunnerResult.repositories, or from the legacy single-repository fields of older runners.'
      required: [key, pushed]
      properties:
        key: { type: string }
        url: { type: string, nullable: true }
        purpose: { allOf: [ { $ref: '#/components/schemas/RepositoryPurpose' } ], nullable: true }
        access: { $ref: '#/components/schemas/GitAccess' }
        primary: { type: boolean }
        branch: { type: string, nullable: true }
        commitSha: { type: string, nullable: true }
        diffStat: { type: object, nullable: true, properties: { files: { type: integer }, insertions: { type: integer }, deletions: { type: integer } } }
        mergeRequestUrl: { type: string, nullable: true }
        pushed: { type: boolean }
        error: { type: string, nullable: true }
    CiContext:
      type: object
      properties:
        provider: { type: string, enum: [GITLAB, GITHUB, OTHER] }
        projectPath: { type: string, nullable: true }
        repositoryUrl:
          type: string
          nullable: true
          description: >-
            URL of the repository the CI job runs in (GitLab CI_PROJECT_URL, GitHub server + repository, otherwise the
            `origin` remote without credentials). Matched to a project repository by normalised URL (ADR 0034); an
            unknown URL is refused with the list of the project's repositories.
        pipelineId: { type: string, nullable: true }
        jobId: { type: string, nullable: true }
        jobUrl: { type: string, nullable: true }
        ref: { type: string, nullable: true }
        commitSha: { type: string, nullable: true }
        defaultBranch: { type: string, nullable: true }
        actor: { type: string, nullable: true }
        mergeRequest:
          type: object
          nullable: true
          properties:
            iid: { type: string }
            title: { type: string, nullable: true }
            description: { type: string, nullable: true }
            sourceBranch: { type: string, nullable: true }
            targetBranch: { type: string, nullable: true }
            url: { type: string, nullable: true }
            author: { type: string, nullable: true }
    WorkflowRunSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        workflowId: { type: string, format: uuid }
        workflowName: { type: string }
        workflowVersion: { type: integer }
        trigger: { type: object, properties: { type: { type: string, enum: [MANUAL, API, CI, JIRA] }, ciExecutionId: { type: string, format: uuid, nullable: true } } }
        issueKey: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RunStatus' }
        outcome: { $ref: '#/components/schemas/RunOutcome' }
        currentNodeId: { type: string, nullable: true }
        waitingOn:
          type: object
          nullable: true
          properties:
            kind: { type: string, enum: [HUMAN_GATE, WAIT_FOR_CI, WRITE_CONFIRMATION], description: 'WRITE_CONFIRMATION = a TASK node waits for a person to confirm its external write (ADR 0033)' }
            nodeId: { type: string }
            approvalId: { type: string, format: uuid, nullable: true }
            signal: { type: string, nullable: true }
        cost: { $ref: '#/components/schemas/Money' }
        apiCost: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'ADR 0042: the run at API list prices (sum of its steps)' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        startedBy: { $ref: '#/components/schemas/ActorRef' }
    WorkflowRun:
      allOf:
        - $ref: '#/components/schemas/WorkflowRunSummary'
        - type: object
          properties:
            input: { allOf: [ { $ref: '#/components/schemas/StartRunRequest' } ], properties: { ci: { $ref: '#/components/schemas/CiContext' } } }
            definitionSnapshot: { $ref: '#/components/schemas/WorkflowDefinition' }
            nodes: { type: array, items: { $ref: '#/components/schemas/NodeExecution' } }
            mergeRequest: { type: object, nullable: true, description: 'the primary repository merge request (or the first one pushed)', properties: { url: { type: string }, branch: { type: string }, targetBranch: { type: string } } }
            repositories:
              type: array
              items: { $ref: '#/components/schemas/RepositoryResult' }
              description: 'latest result per repository over all runner steps of the run (ADR 0034)'
            review: { $ref: '#/components/schemas/ReviewReport' }
            failure: { type: object, nullable: true, properties: { nodeId: { type: string }, message: { type: string }, retryable: { type: boolean } } }
    WorkflowRunPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/WorkflowRunSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    ManualSignal:
      type: object
      required: [signal, status]
      properties:
        signal: { type: string }
        status: { type: string, enum: [SUCCESS, FAIL] }
        message: { type: string, nullable: true }
    ArtifactKind:
      type: string
      enum: [SPEC, PLAN, TASKS, ANALYSIS, DIFF, REVIEW, LOG, JSON, MARKDOWN]
    ArtifactSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        nodeId: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    Artifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactSummary'
        - type: object
          properties:
            content: { type: string }
    LogLine:
      type: object
      properties:
        at: { type: string, format: date-time }
        nodeId: { type: string }
        level: { type: string, enum: [INFO, WARN, ERROR] }
        message: { type: string }

    # ---- approvals
    ApprovalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        workflowName: { type: string }
        issueKey: { type: string, nullable: true }
        nodeId: { type: string }
        question: { type: string }
        options: { type: array, items: { type: string }, example: [approve, revise, reject] }
        context:
          type: object
          properties:
            summary: { type: string, nullable: true }
            confidence: { type: number, nullable: true }
            artifacts: { type: array, items: { $ref: '#/components/schemas/ArtifactSummary' } }
            mergeRequestUrl: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, DECIDED, EXPIRED] }
        createdAt: { type: string, format: date-time }
        decision: { $ref: '#/components/schemas/Decision' }
        approvers: { $ref: '#/components/schemas/GateApprovers' }
        checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        startedBy: { $ref: '#/components/schemas/ActorRef' }
        canDecide: { type: boolean, readOnly: true, description: 'whether the caller may decide this gate' }
        cannotDecideReason: { type: string, nullable: true, readOnly: true }
        assignees:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/Assignee' }
          description: 'named users who decide: the run-time assignment, else the gate''s approvers.users; empty = anyone allowed by the roles rule'
        assignment: { allOf: [ { $ref: '#/components/schemas/ApprovalAssignment' } ], nullable: true, readOnly: true }
        canAssign: { type: boolean, readOnly: true, description: 'whether the caller may assign this open approval (run.assign)' }
        kind:
          type: string
          enum: [GATE, WRITE_CONFIRMATION]
          description: 'GATE = a HUMAN_GATE node; WRITE_CONFIRMATION = a step waits to make the external write in `write` (ADR 0033)'
        write: { allOf: [ { $ref: '#/components/schemas/WritePreview' } ], nullable: true, readOnly: true }
    WritePreview:
      type: object
      description: The exact external write awaiting confirmation; performed as shown after approval, never re-rendered (ADR 0033).
      required: [action, issueKey, contentSha256]
      properties:
        action: { type: string, enum: [JIRA_COMMENT, JIRA_TRANSITION] }
        issueKey: { type: string, example: SHOP-42 }
        comment: { type: string, nullable: true, description: 'JIRA_COMMENT: the exact comment text (plain text)' }
        toStatus: { type: string, nullable: true, description: 'JIRA_TRANSITION: the target status' }
        connectionName: { type: string, nullable: true, description: 'the system (or pinned) connection chosen when the preview was made; null when only a personal connection can write' }
        contentSha256: { type: string, description: SHA-256 of what will be written (recorded in the audit log) }
        connectionMode: { type: string, enum: [SYSTEM, SPECIFIC, ACTING_USER], description: 'the step''s jiraConnection setting (ADR 0035)' }
        personalAllowed: { type: boolean, description: the approver may write with their own personal connection }
        systemAllowed: { type: boolean, description: the system (or pinned) connection may write and one is usable }
        defaultIdentity: { type: string, enum: [SYSTEM, PERSONAL], description: what approve does without a choice }
    WriteIdentity:
      type: object
      description: 'ADR 0035: the identities the caller could approve a Jira write as (write-confirmation dialog).'
      required: [defaultIdentity, systemAllowed, personalAllowed, canApprove]
      properties:
        defaultIdentity: { type: string, enum: [SYSTEM, PERSONAL] }
        systemAllowed: { type: boolean }
        systemConnectionName: { type: string, nullable: true }
        personalAllowed: { type: boolean }
        personalConnectionName: { type: string, nullable: true, description: 'the caller''s own fitting personal connection, null when none' }
        personalProblem: { type: string, nullable: true, description: why the caller cannot write personally }
        canApprove: { type: boolean, description: 'at least one allowed identity is usable for the caller' }
    Assignee:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
    ApprovalAssignment:
      type: object
      description: Run-time assignment of an open approval (ADR 0028); replaces the gate's approvers.users for this approval only.
      required: [userIds, assignedAt]
      properties:
        userIds: { type: array, items: { type: string, format: uuid } }
        assignedBy: { $ref: '#/components/schemas/ActorRef' }
        assignedAt: { type: string, format: date-time }
        comment: { type: string, nullable: true }
    AssignApproval:
      type: object
      required: [userIds]
      properties:
        userIds: { type: array, maxItems: 20, items: { type: string, format: uuid }, description: 'users who decide from now on; empty = back to the gate''s own rule' }
        comment: { type: string, nullable: true, maxLength: 2000 }
    AssigneeCandidate:
      type: object
      required: [userId, displayName, projectRoles, assigned]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        projectRoles: { type: array, items: { type: string } }
        assigned: { type: boolean, description: 'currently one of the assignees' }
    Decision:
      type: object
      required: [option]
      properties:
        option: { type: string }
        comment: { type: string, nullable: true }
        writeAs: { type: string, enum: [SYSTEM, PERSONAL], nullable: true, description: 'write confirmations (ADR 0035): who writes after approval; null = the step''s default' }
        checkedItems: { type: array, items: { type: string }, description: checklist item ids ticked by the approver }
        decidedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true }
        editedArtifacts:
          type: array
          items: { type: object, required: [artifactId, content], properties: { artifactId: { type: string, format: uuid }, content: { type: string } } }
        decidedAt: { type: string, format: date-time, readOnly: true }

    # ---- CI
    CiExecutionRequest:
      type: object
      required: [entrypoint, context]
      properties:
        entrypoint: { type: string }
        context: { $ref: '#/components/schemas/CiContext' }
        diff: { type: string, nullable: true, description: 'unified diff, at most 2 MB' }
        changedFiles: { type: array, items: { type: string } }
        variables: { type: object, additionalProperties: { type: string } }
    Finding:
      type: object
      properties:
        severity: { type: string, enum: [BLOCKER, MAJOR, MINOR, NIT] }
        file: { type: string }
        line: { type: integer, nullable: true }
        title: { type: string }
        detail: { type: string }
        suggestion: { type: string, nullable: true }
    ReviewReport:
      type: object
      nullable: true
      properties:
        verdict: { type: string, enum: [APPROVE, COMMENT, REQUEST_CHANGES] }
        score: { type: integer }
        summary: { type: string }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        modelRef: { $ref: '#/components/schemas/ModelRef' }
        usage: { $ref: '#/components/schemas/TokenUsage' }
        cost: { $ref: '#/components/schemas/Money' }
    CiExecutionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        entrypoint: { type: string }
        mode: { type: string, enum: [BLOCKING, ADVISORY] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        gateResult: { type: string, enum: [PASS, FAIL, PENDING] }
        runId: { type: string, format: uuid, nullable: true }
        repositoryKey: { type: string, nullable: true, description: 'project repository the CI job runs in, matched by URL (ADR 0034); null for older CI clients that send no URL' }
        context: { $ref: '#/components/schemas/CiContext' }
        cost: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    CiExecution:
      allOf:
        - $ref: '#/components/schemas/CiExecutionSummary'
        - type: object
          properties:
            summary: { type: string, nullable: true }
            report: { $ref: '#/components/schemas/ReviewReport' }
            diffArtifactId: { type: string, format: uuid, nullable: true }
            changedFiles: { type: array, items: { type: string } }
            variables: { type: object, additionalProperties: { type: string } }
            error: { type: string, nullable: true }
    CiExecutionPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/CiExecutionSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    CiSignalRequest:
      type: object
      required: [signal, status, context]
      properties:
        signal: { type: string }
        status: { type: string, enum: [SUCCESS, FAIL] }
        runId: { type: string, format: uuid, nullable: true, description: from the Back-Office-Run git trailer }
        branch: { type: string, nullable: true, description: fallback matching key }
        commitSha: { type: string, nullable: true }
        message: { type: string, nullable: true }
        context: { $ref: '#/components/schemas/CiContext' }
    CiSignalResult:
      type: object
      properties:
        runId: { type: string, format: uuid, nullable: true }
        resumed: { type: boolean }
        message: { type: string }

    # ---- task library
    TaskExecutor:
      type: string
      enum: [LLM, SPEC_KIT, IMPLEMENT, FETCH_ISSUE, NOTIFY, TRANSITION_ISSUE]
    Scope:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [GLOBAL, PROJECT] }
        projectId: { type: string, format: uuid, nullable: true }
    Slot:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [INPUT, STATE, ARTIFACT] }
        required: { type: boolean, default: true }
        description: { type: string, nullable: true }
    TaskInterfaceInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string }
        description: { type: string }
        inputs: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        outputs: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        ports: { type: array, items: { type: string }, default: [success, failure] }
    TaskInterface:
      allOf:
        - $ref: '#/components/schemas/TaskInterfaceInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            builtIn: { type: boolean }
            implementedBy: { type: array, items: { type: string }, readOnly: true }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who saved the current version (ADR 0017) }
    TaskPrompt:
      type: object
      properties:
        system: { type: string, nullable: true }
        user: { type: string, nullable: true }
        mode: { type: string, enum: [APPEND, REPLACE], default: APPEND }
    TaskTemplateInput:
      type: object
      required: [key, name, scope]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string }
        description: { type: string }
        abstract: { type: boolean, default: false }
        extendsKey: { type: string, nullable: true }
        implements: { type: array, items: { type: string } }
        executor: { allOf: [ { $ref: '#/components/schemas/TaskExecutor' } ], nullable: true, description: required on concrete templates unless inherited }
        scope: { $ref: '#/components/schemas/Scope' }
        modelProfileId: { type: string, format: uuid, nullable: true }
        prompt: { $ref: '#/components/schemas/TaskPrompt' }
        skills: { type: array, items: { type: string } }
        removeSkills: { type: array, items: { type: string } }
        config: { type: object, additionalProperties: true }
        outputSchema: { type: string, nullable: true, description: JSON Schema (LLM executor) }
        confidenceField: { type: string, nullable: true }
        produces: { type: array, items: { type: string } }
        consumes: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        sandboxPolicy: { $ref: '#/components/schemas/SandboxPolicy' }
    TaskTemplate:
      allOf:
        - $ref: '#/components/schemas/TaskTemplateInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            builtIn: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who saved the current version (ADR 0017) }
    ResolvedTask:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        executor: { $ref: '#/components/schemas/TaskExecutor' }
        modelProfileId: { type: string, format: uuid, nullable: true }
        prompt: { type: object, properties: { system: { type: string, nullable: true }, user: { type: string, nullable: true } } }
        skills: { type: array, items: { type: object, properties: { key: { type: string }, name: { type: string } } } }
        config: { type: object, additionalProperties: true }
        outputSchema: { type: string, nullable: true }
        confidenceField: { type: string, nullable: true }
        produces: { type: array, items: { type: string } }
        consumes: { type: array, items: { type: string } }
        interfaces: { type: array, items: { type: string } }
        lineage: { type: array, items: { type: string } }
        ports: { type: array, items: { type: string } }
        abstract: { type: boolean }
        interfaceCheck: { type: object, properties: { ok: { type: boolean }, problems: { type: array, items: { type: string } } } }
    SkillInput:
      type: object
      required: [key, name, content, scope]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string }
        description: { type: string }
        content: { type: string, description: 'SKILL.md body (markdown)' }
        scope: { $ref: '#/components/schemas/Scope' }
        tags: { type: array, items: { type: string } }
    Skill:
      allOf:
        - $ref: '#/components/schemas/SkillInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            builtIn: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who saved the current version (ADR 0017) }

    # ---- identity & access
    ActorRef:
      type: object
      nullable: true
      properties:
        kind: { type: string, enum: [USER, PERSONAL_TOKEN, CI_TOKEN, SYSTEM] }
        userId: { type: string, format: uuid, nullable: true }
        displayName: { type: string }
    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
    Me:
      type: object
      required: [user, platformPermissions, projects, idleTimeoutSeconds]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        platformPermissions: { type: array, items: { type: string } }
        allProjects: { type: boolean, description: holder of admin.projects.all }
        projects:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              projectKey: { type: string }
              roles: { type: array, items: { type: string } }
              permissions: { type: array, items: { type: string } }
        groups: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
        preferences: { $ref: '#/components/schemas/UserPreferences' }
        idleTimeoutSeconds: { type: integer }
        absoluteExpiresAt: { type: string, format: date-time }
        authenticatedAt: { type: string, format: date-time }
    UserPreferences:
      type: object
      properties:
        theme: { type: string, enum: [SYSTEM, LIGHT, DARK], default: SYSTEM }
        defaultProjectId: { type: string, format: uuid, nullable: true }
        pageSize: { type: integer, default: 20, minimum: 10, maximum: 200 }
    AuthConfig:
      type: object
      properties:
        loginUrl: { type: string, example: /oauth2/authorization/oidc }
        providerName: { type: string, example: Keycloak }
        registration: { type: string, enum: [OPEN, INVITE_ONLY] }
        accountUrl: { type: string, nullable: true, description: 'provider page for password / MFA changes' }
        methods:
          type: object
          properties:
            local: { type: boolean, description: local e-mail + password login enabled }
            oidc: { type: boolean, description: an OIDC provider is configured }
        passwordPolicy: { $ref: '#/components/schemas/PasswordPolicy' }
    SessionInfo:
      type: object
      properties:
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        idleTimeoutSeconds: { type: integer }
    SessionSummary:
      type: object
      properties:
        id: { type: string, description: hashed session id }
        createdAt: { type: string, format: date-time }
        lastAccessAt: { type: string, format: date-time }
        sourceIp: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
    UserStatus:
      type: string
      enum: [INVITED, ACTIVE, DEACTIVATED]
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          properties:
            issuer: { type: string, nullable: true }
            subject: { type: string, nullable: true }
            groups: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
            platformRoles: { type: array, items: { type: string }, description: roles assigned at USER level }
            projectMemberships:
              type: array
              items:
                type: object
                properties:
                  projectId: { type: string, format: uuid }
                  projectKey: { type: string }
                  role: { type: string }
                  viaGroup: { type: string, nullable: true }
            lastLoginAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            createdBy: { $ref: '#/components/schemas/ActorRef' }
            signInUrl: { type: string, nullable: true, description: link to send to an invited user }
            authMode: { $ref: '#/components/schemas/AuthMode' }
            hasPassword: { type: boolean }
            mfaEnabled: { type: boolean }
            lockedUntil: { type: string, format: date-time, nullable: true }
            mustChangePassword: { type: boolean }
            setPasswordUrl: { type: string, nullable: true, description: 'one-time link for a local user to set the first password (returned on invite / auth-mode change only)' }
    UserPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/UserDetail' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    UserInvite:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        authMode: { allOf: [ { $ref: '#/components/schemas/AuthMode' } ], description: 'default OIDC when a provider is configured, otherwise LOCAL' }
        groupIds: { type: array, items: { type: string, format: uuid } }
        platformRoles: { type: array, items: { type: string } }
        projectMemberships:
          type: array
          items: { type: object, required: [projectId, role], properties: { projectId: { type: string, format: uuid }, role: { type: string } } }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string }
        groupIds: { type: array, items: { type: string, format: uuid } }
        platformRoles: { type: array, items: { type: string } }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount: { type: integer }
        memberIds: { type: array, items: { type: string, format: uuid } }
        platformRoles: { type: array, items: { type: string } }
        externalGroup: { type: string, nullable: true, description: 'OIDC groups claim value synchronised into this group on login' }
        createdAt: { type: string, format: date-time }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        memberIds: { type: array, items: { type: string, format: uuid } }
        platformRoles: { type: array, items: { type: string } }
        externalGroup: { type: string, nullable: true }
    PermissionScope:
      type: string
      enum: [PLATFORM, PROJECT]
    PermissionDefinition:
      type: object
      properties:
        key: { type: string }
        scope: { $ref: '#/components/schemas/PermissionScope' }
        module: { type: string }
        description: { type: string }
    Role:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        scope: { $ref: '#/components/schemas/PermissionScope' }
        permissions: { type: array, items: { type: string } }
        builtIn: { type: boolean }
    RoleInput:
      type: object
      required: [key, name, scope, permissions]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
        name: { type: string }
        description: { type: string, nullable: true }
        scope: { $ref: '#/components/schemas/PermissionScope' }
        permissions: { type: array, items: { type: string } }
    GrantLevel:
      type: string
      enum: [SYSTEM, GROUP, USER]
    Grant:
      type: object
      required: [permission, effect]
      properties:
        permission: { type: string }
        effect: { type: string, enum: [ALLOW, DENY] }
    GrantSet:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/GrantLevel' }
        targetId: { type: string, format: uuid, nullable: true, description: group or user id; null for SYSTEM }
        targetName: { type: string, nullable: true, readOnly: true }
        roles: { type: array, items: { type: string }, description: platform roles assigned at this level }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' }, description: individual ALLOW/DENY overrides }
    EffectivePermissions:
      type: object
      properties:
        userId: { type: string, format: uuid }
        rows:
          type: array
          items:
            type: object
            properties:
              permission: { type: string }
              description: { type: string }
              system: { type: string, enum: [ALLOW, DENY, NONE] }
              groups:
                type: array
                items: { type: object, properties: { groupId: { type: string, format: uuid }, groupName: { type: string }, effect: { type: string, enum: [ALLOW, DENY, NONE] } } }
              user: { type: string, enum: [ALLOW, DENY, NONE] }
              effective: { type: boolean }
              source: { type: string, description: 'which level decided, e.g. GROUP:Architects or USER' }
        projects:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              projectKey: { type: string }
              roles: { type: array, items: { type: string } }
              permissions: { type: array, items: { type: string } }
    PlatformSettings:
      type: object
      properties:
        registration: { type: string, enum: [OPEN, INVITE_ONLY] }
        allowedEmailDomains: { type: array, items: { type: string } }
        syncGroupsFromIdentityProvider: { type: boolean }
        specKitAllowed: { type: boolean, default: true, description: 'ADR 0036: projects may turn Spec Kit on; false = no project can use Spec Kit steps' }
        personalTokenMaxDays: { type: integer, default: 90 }
        localLoginEnabled: { type: boolean, default: true }
        mfaRequiredForLocal: { type: boolean, default: false, description: local users must enrol TOTP at their next login }
        passwordPolicy: { $ref: '#/components/schemas/PasswordPolicy' }
        lockout:
          type: object
          properties:
            maxFailures: { type: integer, default: 5 }
            lockMinutes: { type: integer, default: 15, description: doubles on every further lockout up to 24 h }
    ProjectMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        principal:
          type: object
          properties:
            type: { type: string, enum: [USER, GROUP] }
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, nullable: true }
        role: { type: string }
        addedAt: { type: string, format: date-time }
        addedBy: { $ref: '#/components/schemas/ActorRef' }
    ProjectMemberInput:
      type: object
      required: [principalType, principalId, role]
      properties:
        principalType: { type: string, enum: [USER, GROUP] }
        principalId: { type: string, format: uuid }
        role: { type: string, description: project role key }
    PersonalToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        permissions: { type: array, items: { type: string }, description: empty = all of the owner's permissions }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        allowMcpGateDecisions: { type: boolean, description: 'The token may decide human gates through the MCP tool decide_gate (ADR 0029)' }
        allowMcpWorkflowEdits: { type: boolean, description: 'The token may create and change workflows through the MCP tools create_workflow and update_workflow (ADR 0049)' }
    PersonalTokenInput:
      type: object
      required: [name, expiresInDays]
      properties:
        name: { type: string }
        expiresInDays: { type: integer, minimum: 1, maximum: 365 }
        permissions: { type: array, items: { type: string } }
        allowMcpGateDecisions: { type: boolean, default: false, description: 'Allow decide_gate through the MCP server; off by default because an IDE agent holding the token can be steered by prompt injection' }
        allowMcpWorkflowEdits: { type: boolean, default: false, description: 'Allow create_workflow and update_workflow through the MCP server; off by default because an AI agent holding the token could otherwise change a workflow on its own (for example remove a human gate)' }
    PersonalTokenCreated:
      allOf:
        - $ref: '#/components/schemas/PersonalToken'
        - type: object
          required: [token]
          properties:
            token: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventTime: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/ActorRef' }
        operation: { type: string }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        projectId: { type: string, format: uuid, nullable: true }
        result: { type: string, enum: [SUCCESS, DENIED, FAILURE] }
        details: { type: object, additionalProperties: true }
        correlationId: { type: string, nullable: true }
        sourceIp: { type: string, nullable: true }
    AuditPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        nextCursor: { type: string, nullable: true }
    GateApprovers:
      type: object
      nullable: true
      properties:
        projectRoles: { type: array, items: { type: string }, description: 'empty = anyone with run.approve' }
        users: { type: array, items: { type: string, format: uuid } }
        accountable: { type: string, nullable: true, description: 'the single accountable project role (RACI "A")' }
        forbidSelfApproval: { type: boolean, default: false }
    ChecklistItem:
      type: object
      required: [id, text]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        text: { type: string }
        required: { type: boolean, default: true }

    # ---- local accounts (ADR 0021)
    AuthMode:
      type: string
      enum: [LOCAL, OIDC, BOTH]
      description: How the user may sign in. OIDC users have no password; LOCAL users cannot use the identity provider.
    LocalLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        returnTo: { type: string, nullable: true, description: relative path to go to after login }
    MfaLoginRequest:
      type: object
      required: [mfaToken]
      properties:
        mfaToken: { type: string, description: 'from the first step, valid 5 minutes' }
        code: { type: string, nullable: true, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, nullable: true }
    LoginStepResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [AUTHENTICATED, MFA_REQUIRED, MFA_ENROLMENT_REQUIRED, PASSWORD_CHANGE_REQUIRED] }
        mfaToken: { type: string, nullable: true }
        returnTo: { type: string, nullable: true }
    PasswordPolicy:
      type: object
      properties:
        minLength: { type: integer, default: 12 }
        maxLength: { type: integer, default: 128 }
        rejectCommon: { type: boolean, default: true, description: rejects passwords from the built-in list of common passwords }
        rejectContainingEmail: { type: boolean, default: true }
    PasswordChangeRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, format: password, nullable: true, description: not needed during a forced change right after login with a one-time link }
        newPassword: { type: string, format: password }
    PasswordResetInfo:
      type: object
      properties:
        email: { type: string }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [SET_INITIAL, RESET] }
        policy: { $ref: '#/components/schemas/PasswordPolicy' }
    PasswordResetLink:
      type: object
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    MySecurity:
      type: object
      properties:
        authMode: { $ref: '#/components/schemas/AuthMode' }
        hasPassword: { type: boolean }
        passwordChangedAt: { type: string, format: date-time, nullable: true }
        mfaEnabled: { type: boolean }
        mfaRequired: { type: boolean }
        recoveryCodesRemaining: { type: integer }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        lastLoginMethod: { type: string, enum: [LOCAL, OIDC], nullable: true }
        recentLogins: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, method: { type: string }, result: { type: string }, sourceIp: { type: string, nullable: true } } } }
        policy: { $ref: '#/components/schemas/PasswordPolicy' }
    TotpEnrolment:
      type: object
      properties:
        secret: { type: string, description: base32 }
        otpauthUri: { type: string }
        qrSvg: { type: string, description: inline SVG markup of the QR code }
    RecoveryCodes:
      type: object
      properties:
        codes: { type: array, items: { type: string } }

    # ---- runner fleet v2 (ADR 0024)
    SandboxIsolation:
      type: string
      enum: [STANDARD, HIGH, DEV]
      description: 'STANDARD = gVisor, HIGH = Kata microVM, DEV = runc (docker backend only)'
    SandboxPolicy:
      type: object
      description: 'Narrowing-only override: a lower level can restrict but never widen the ceiling of the level above.'
      properties:
        isolation: { $ref: '#/components/schemas/SandboxIsolation' }
        resources:
          type: object
          properties:
            cpu: { type: string, example: '2' }
            memory: { type: string, example: 4Gi }
            ephemeralStorage: { type: string, example: 10Gi }
            pids: { type: integer }
        timeoutSeconds: { type: integer }
        network:
          type: object
          properties:
            allow: { type: array, items: { type: string }, description: 'host[:port] patterns, * wildcard for one label' }
        tools:
          type: object
          properties:
            allow: { type: array, items: { type: string } }
            deny: { type: array, items: { type: string } }
            ask: { type: array, items: { type: string }, description: 'unattended jobs treat ask as deny and report it' }
        secrets: { type: array, items: { type: string }, description: 'names resolved in the runner cluster' }
        environment:
          type: object
          properties:
            image: { type: string }
            setupCommand: { type: string, nullable: true }
            caches: { type: array, items: { type: string, enum: [gradle, maven, npm, pnpm, pip, cargo, go] } }
        maxCostUsd: { type: number, nullable: true }
        maxTokens: { type: integer, nullable: true }
        poolSelector: { type: object, additionalProperties: { type: string }, description: 'labels the pool must have' }
    SandboxPolicyView:
      type: object
      properties:
        project: { $ref: '#/components/schemas/SandboxPolicy' }
        effective: { $ref: '#/components/schemas/SandboxPolicy' }
        ceiling: { $ref: '#/components/schemas/SandboxPolicy' }
        sources: { type: object, additionalProperties: { type: string }, description: 'field path -> level that set it (PLATFORM, POOL, PROJECT, TEMPLATE, NODE)' }
        poolId: { type: string, nullable: true, description: pool whose ceiling applies; null = platform defaults only }
        warnings: { type: array, items: { type: string }, description: 'project settings the ceiling narrowed, e.g. an egress host outside the pool allow-list' }
    RunnerPoolInput:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
        name: { type: string }
        description: { type: string, nullable: true }
        labels: { type: object, additionalProperties: { type: string } }
        ceiling: { $ref: '#/components/schemas/SandboxPolicy' }
        allowedImages: { type: array, items: { type: string }, description: 'image reference patterns, e.g. ghcr.io/org/back-office-runner:*' }
        warmPoolSize: { type: integer, default: 2 }
        maxConcurrentJobs: { type: integer, default: 10 }
        projectIds: { type: array, items: { type: string, format: uuid }, description: 'empty = any project' }
    RunnerPool:
      allOf:
        - $ref: '#/components/schemas/RunnerPoolInput'
        - type: object
          properties:
            runners: { type: integer }
            onlineRunners: { type: integer }
            queued: { type: integer }
            running: { type: integer }
            createdAt: { type: string, format: date-time }
            ownerUserId: { type: string, format: uuid, nullable: true, description: 'ADR 0040: owner of a personal pool (managed under My account); null = shared pool' }
            llmCredentials: { $ref: '#/components/schemas/LlmCredentials' }
    LlmCredentials:
      type: string
      enum: [GATEWAY, LOCAL_LOGIN]
      description: >-
        ADR 0040: how Claude Code in a pool's sandboxes reaches the model. GATEWAY = the Back Office LLM gateway (metered,
        budgets apply). LOCAL_LOGIN = personal pools only: the login of the pool's owner (CLAUDE_CODE_OAUTH_TOKEN on their
        runner-controller), not metered by Back Office. OpenCode always uses the gateway.
    PersonalRunner:
      type: object
      required: [poolId, llmCredentials, runners, queued, running, createdAt]
      properties:
        poolId: { type: string }
        llmCredentials: { $ref: '#/components/schemas/LlmCredentials' }
        runners: { type: array, items: { $ref: '#/components/schemas/Runner' } }
        queued: { type: integer }
        running: { type: integer }
        createdAt: { type: string, format: date-time }
    PersonalRunnerInput:
      type: object
      required: [llmCredentials]
      properties:
        llmCredentials: { $ref: '#/components/schemas/LlmCredentials' }
    PersonalRegistrationToken:
      type: object
      required: [token, expiresAt, dockerCommand]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        dockerCommand: { type: string, description: 'docker run of the runner-controller (DOCKER backend) for your computer; secrets other than the token are passed by name (-e NAME)' }
    Runner:
      type: object
      properties:
        id: { type: string, format: uuid }
        poolId: { type: string }
        name: { type: string }
        version: { type: string }
        backends: { type: array, items: { type: string, enum: [AGENT_SANDBOX, K8S_JOB, DOCKER] } }
        runtimeClasses: { type: array, items: { type: string } }
        maxConcurrent: { type: integer }
        running: { type: integer }
        lastSeenAt: { type: string, format: date-time }
        online: { type: boolean }
        cluster: { type: string, nullable: true }
        registeredAt: { type: string, format: date-time }
    RunnerRegistration:
      type: object
      required: [registrationToken, name, version, capabilities]
      properties:
        registrationToken: { type: string }
        name: { type: string }
        version: { type: string }
        cluster: { type: string, nullable: true }
        capabilities:
          type: object
          properties:
            backends: { type: array, items: { type: string, enum: [AGENT_SANDBOX, K8S_JOB, DOCKER] } }
            runtimeClasses: { type: array, items: { type: string } }
            maxConcurrent: { type: integer }
    RunnerRegistered:
      type: object
      properties:
        runnerId: { type: string, format: uuid }
        runnerToken: { type: string }
        poolId: { type: string }
    RunnerConfig:
      type: object
      properties:
        poolId: { type: string }
        ceiling: { $ref: '#/components/schemas/SandboxPolicy' }
        allowedImages: { type: array, items: { type: string } }
        warmPoolSize: { type: integer }
        gateway:
          type: object
          properties:
            anthropicBaseUrl: { type: string }
            openaiBaseUrl: { type: string }
            apiBaseUrl: { type: string }
        signingKeys: { type: array, items: { type: object, additionalProperties: true }, description: JWK set (Ed25519) }
    LeaseRequest:
      type: object
      properties:
        maxJobs: { type: integer, default: 1 }
        waitSeconds: { type: integer, default: 25, maximum: 30 }
        freeSlots: { type: integer }
        harnesses: { type: array, items: { type: string, enum: [OPENCODE, CLAUDE_CODE] }, description: 'ADR 0050 step 3: the coding agents the runner image provides (omitted = not reported)' }
        claudeLogin: { type: boolean, description: 'ADR 0050 step 3: a Claude login (CLAUDE_CODE_OAUTH_TOKEN) is set for LOCAL_LOGIN jobs; the first true of a personal runner creates its owner''s Claude Code login model profiles' }
    AgentJobStatus:
      type: string
      enum: [QUEUED, LEASED, STARTING, RUNNING, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED, LOST]
    AgentJobAssignment:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        leaseExpiresAt: { type: string, format: date-time }
        jobToken: { type: string, description: 'bo_job_; the only credential given to the sandbox' }
        spec: { $ref: '#/components/schemas/RunnerJobSpec' }
        policy: { $ref: '#/components/schemas/SandboxPolicy' }
        specDigest: { type: string, description: 'lowercase hex sha256 (optionally prefixed sha256:) of the canonical JSON of {"policy": policy, "spec": spec}: RFC 8785 with null members removed (docs/architecture/10-agent-execution.md, Assignment verification)' }
        signature: { type: string, description: 'base64 Ed25519 over jobId|specDigest|leaseExpiresAt' }
        keyId: { type: string }
    JobHeartbeat:
      type: object
      properties:
        phase: { type: string, enum: [STARTING, RUNNING] }
        sandboxName: { type: string, nullable: true }
        node: { type: string, nullable: true }
        cpuMillis: { type: integer, nullable: true }
        memoryBytes: { type: integer, format: int64, nullable: true }
    JobHeartbeatResponse:
      type: object
      properties:
        leaseExpiresAt: { type: string, format: date-time }
        cancelRequested: { type: boolean }
    JobCompletion:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AgentJobStatus' }
        exitCode: { type: integer, nullable: true }
        reason: { type: string, nullable: true, description: 'e.g. OOMKilled, DeadlineExceeded, ImagePullBackOff, policy-violation' }
        imageDigest: { type: string, nullable: true }
        egressLogDigest: { type: string, nullable: true }
        egressDenied: { type: array, items: { type: string }, description: hosts the proxy refused }
        durationMs: { type: integer, format: int64 }
    UploadRequest:
      type: object
      required: [name, contentType, sizeBytes]
      properties:
        name: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
    UploadTarget:
      type: object
      properties:
        url: { type: string }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        blobKey: { type: string }
        expiresAt: { type: string, format: date-time }
    GitAccess:
      type: string
      enum: [NONE, READ, PUSH_MR]
      description: >-
        Git rights of an agent job (ADR 0031), derived by Back Office: IMPLEMENT or SPEC_KIT with
        `repository.push` -> PUSH_MR (push the job branch, open a merge request through push options, never
        merge); any other job with a repository -> READ (clone and fetch only, the runner never pushes); no
        repository -> NONE. Only the level is sent; the runner-controller selects the matching credential of its
        cluster (read Secret, push Secret, none). Absent in specs from older Back Office versions: derived the
        same way. Multi-repository jobs (ADR 0034): every `repositories[]` entry carries its own `access`
        (READ or PUSH_MR); the top-level `gitAccess` is the highest access among the entries, kept for older
        runner-controllers.
    AgentJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: 'human label, e.g. project key, run and node' }
        poolId: { type: string, nullable: true }
        runnerId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/AgentJobStatus' }
        mode: { type: string }
        projectId: { type: string, format: uuid, nullable: true }
        runId: { type: string, format: uuid, nullable: true }
        nodeId: { type: string, nullable: true }
        benchmarkId: { type: string, format: uuid, nullable: true }
        model: { $ref: '#/components/schemas/ModelRef' }
        isolation: { $ref: '#/components/schemas/SandboxIsolation' }
        policy: { $ref: '#/components/schemas/SandboxPolicy' }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        cost: { $ref: '#/components/schemas/Money' }
        egressDenied: { type: array, items: { type: string } }
        policySources: { type: object, additionalProperties: { type: string }, description: field path -> level that set it }
        cancelRequested: { type: boolean }
        leaseExpiresAt: { type: string, format: date-time, nullable: true }
        attempts: { type: integer, description: 'leases so far; a job is retried after a lost lease' }
        priority: { type: integer, description: higher runs first; interactive work outranks benchmarks }
        gitAccess: { $ref: '#/components/schemas/GitAccess' }
    AgentJobPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AgentJob' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    WorkItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        dedupeKey: { type: string, nullable: true }
        status: { type: string, enum: [READY, LEASED, DONE, DEAD] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        runAfter: { type: string, format: date-time }
        leaseOwner: { type: string, nullable: true }
        leaseUntil: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkItemPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/WorkItem' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    OperationsOverview:
      type: object
      properties:
        replicas: { type: array, items: { type: object, properties: { instance: { type: string }, roles: { type: array, items: { type: string } }, version: { type: string }, lastSeenAt: { type: string, format: date-time }, stale: { type: boolean, description: no heartbeat within 2 minutes } } } }
        workItems: { type: object, additionalProperties: { type: integer }, description: count per status }
        deadItems: { type: integer }
        oldestReadyAgeSeconds: { type: integer }
        agentJobs: { type: object, additionalProperties: { type: integer }, description: count per status }
        sseSubscribers: { type: integer }

    # ---- budgets, insights, provenance (ADR 0025)
    BudgetInput:
      type: object
      properties:
        monthlyLimitUsd: { type: number, nullable: true, description: null = no limit }
        alertAtPercent: { type: integer, default: 80 }
        hardStop: { type: boolean, default: true }
    BudgetStatus:
      type: object
      properties:
        scope: { type: string, enum: [PLATFORM, PROJECT] }
        projectId: { type: string, format: uuid, nullable: true }
        projectKey: { type: string, nullable: true }
        period: { type: string, example: 2026-09 }
        monthlyLimitUsd: { type: number, nullable: true }
        alertAtPercent: { type: integer }
        hardStop: { type: boolean }
        spentUsd: { type: number }
        forecastUsd: { type: number, description: linear forecast to month end }
        state: { type: string, enum: [OK, ALERT, EXCEEDED, NO_LIMIT] }
    DistributionStat:
      type: object
      properties:
        p50Seconds: { type: number, nullable: true }
        p90Seconds: { type: number, nullable: true }
        totalSeconds: { type: number, nullable: true }
        count: { type: integer }
    DeliveryInsights:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        projectId: { type: string, format: uuid, nullable: true }
        leadTime: { $ref: '#/components/schemas/DistributionStat' }
        humanWait: { $ref: '#/components/schemas/DistributionStat' }
        ciWait: { $ref: '#/components/schemas/DistributionStat' }
        runs: { type: object, properties: { total: { type: integer }, succeeded: { type: integer }, failed: { type: integer }, cancelled: { type: integer } } }
        reworkLoopsPerRun: { type: number, nullable: true }
        costPerSuccessfulRun: { $ref: '#/components/schemas/Money' }
        costPerMergeRequest: { $ref: '#/components/schemas/Money' }
        totalCost: { $ref: '#/components/schemas/Money' }
        agentSuccessByTemplate: { type: array, items: { type: object, properties: { templateKey: { type: string }, jobs: { type: integer }, succeeded: { type: integer }, rate: { type: number }, cost: { $ref: '#/components/schemas/Money' } } } }
        agentSuccessByModel: { type: array, items: { type: object, properties: { model: { type: string }, jobs: { type: integer }, succeeded: { type: integer }, rate: { type: number }, cost: { $ref: '#/components/schemas/Money' } } } }
        gateDecisions: { type: array, items: { type: object, properties: { option: { type: string }, count: { type: integer } } } }
        weekly: { type: array, items: { type: object, properties: { weekStart: { type: string, format: date }, succeeded: { type: integer }, failed: { type: integer }, humanWaitHours: { type: number }, cost: { $ref: '#/components/schemas/Money' } } } }
        bottleneck: { type: object, nullable: true, properties: { nodeId: { type: string }, nodeName: { type: string }, workflowName: { type: string }, p90WaitSeconds: { type: number } }, description: the gate with the longest p90 wait }
        modelMix: { type: array, description: cost and tokens per model of the runs in scope, items: { type: object, properties: { model: { type: string }, calls: { type: integer }, inputTokens: { type: integer }, outputTokens: { type: integer }, cost: { $ref: '#/components/schemas/Money' } } } }
    WorkflowMetrics:
      type: object
      description: Effectiveness and efficiency of a set of runs (ADR 0037; definitions in docs/architecture/11-governance.md).
      properties:
        runs:
          type: object
          properties:
            total: { type: integer }
            successful: { type: integer, description: 'status SUCCEEDED with outcome SUCCESS' }
            failed: { type: integer, description: 'status FAILED, or SUCCEEDED through a FAILURE end' }
            cancelled: { type: integer }
            active: { type: integer, description: not finished yet }
            modified: { type: integer, description: runs of locally modified linked copies }
        successRate: { type: number, nullable: true, description: successful / finished }
        firstPassRate: { type: number, nullable: true, description: successful without a revise decision or a retried step / finished }
        reworkLoopsPerRun: { type: number, nullable: true }
        duration: { $ref: '#/components/schemas/DistributionStat' }
        activeTime: { $ref: '#/components/schemas/DistributionStat' }
        humanWait: { $ref: '#/components/schemas/DistributionStat' }
        totalCost: { $ref: '#/components/schemas/Money' }
        costPerRun: { $ref: '#/components/schemas/Money' }
        costPerSuccessfulRun: { $ref: '#/components/schemas/Money' }
        totalApiCost: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'ADR 0042: totalCost plus what subscriptions paid for, at API list prices' }
        apiCostPerRun: { $ref: '#/components/schemas/Money' }
        apiCostPerSuccessfulRun: { $ref: '#/components/schemas/Money' }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        mergeRequests: { type: integer }
    WorkflowNodeMetrics:
      type: object
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        kind: { $ref: '#/components/schemas/NodeKind' }
        templateKey: { type: string, nullable: true }
        executions: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        failureRate: { type: number, nullable: true }
        duration: { $ref: '#/components/schemas/DistributionStat' }
        cost: { $ref: '#/components/schemas/Money' }
        apiCost: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'ADR 0042: the node at API list prices' }
        ports: { type: array, items: { type: object, properties: { port: { type: string }, count: { type: integer } } } }
    WorkflowInsights:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        libraryWorkflowId: { type: string, format: uuid, nullable: true }
        workflowId: { type: string, format: uuid, nullable: true }
        totals: { $ref: '#/components/schemas/WorkflowMetrics' }
        byVersion: { type: array, description: 'library versions (library scope) or workflow versions (workflow scope), newest first', items: { type: object, properties: { version: { type: integer }, metrics: { $ref: '#/components/schemas/WorkflowMetrics' } } } }
        byProject: { type: array, description: library scope only, items: { type: object, properties: { projectId: { type: string, format: uuid }, projectKey: { type: string }, metrics: { $ref: '#/components/schemas/WorkflowMetrics' } } } }
        byNode: { type: array, items: { $ref: '#/components/schemas/WorkflowNodeMetrics' } }
        weekly: { type: array, items: { type: object, properties: { weekStart: { type: string, format: date }, successful: { type: integer }, failed: { type: integer }, cost: { $ref: '#/components/schemas/Money' } } } }
    LibraryWorkflowMetricsRow:
      type: object
      properties:
        libraryWorkflowId: { type: string, format: uuid }
        metrics: { $ref: '#/components/schemas/WorkflowMetrics' }
    AttestationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        nodeId: { type: string, nullable: true }
        jobId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [AGENT_JOB, RUN] }
        subjects: { type: array, items: { type: object, properties: { name: { type: string }, digest: { type: object, additionalProperties: { type: string } } } } }
        keyId: { type: string }
        createdAt: { type: string, format: date-time }
    DsseEnvelope:
      type: object
      required: [payloadType, payload, signatures]
      properties:
        payloadType: { type: string, example: application/vnd.in-toto+json }
        payload: { type: string, description: base64 in-toto Statement v1 }
        signatures: { type: array, items: { type: object, properties: { keyid: { type: string }, sig: { type: string } } } }

    # ---- model evaluation (unchanged)
    Pricing:
      type: object
      required: [inputPerMTok, outputPerMTok]
      properties:
        inputPerMTok: { type: number }
        outputPerMTok: { type: number }
        cacheReadPerMTok: { type: number, nullable: true }
        cacheWritePerMTok: { type: number, nullable: true }
        currency: { type: string, default: USD }
    ModelProfileInput:
      type: object
      required: [displayName, ref, pricing]
      properties:
        displayName: { type: string }
        ref: { $ref: '#/components/schemas/ModelRef' }
        pricing: { $ref: '#/components/schemas/Pricing' }
        capabilities: { type: array, items: { type: string, enum: [CODING, REASONING, LONG_CONTEXT, TOOLS, VISION, CHEAP] } }
        contextWindow: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        enabled: { type: boolean, default: true }
        runtime: { $ref: '#/components/schemas/ModelRuntime' }
        personal:
          type: boolean
          default: false
          description: >-
            ADR 0050 step 2: a personal profile of the caller, seen and used only by them (in private projects and their own
            benchmarks); needs models.view instead of models.manage. A Claude Code login profile is always personal. Set on
            create only; the scope of a profile does not change.
    ModelRuntime:
      type: string
      enum: [API, CLAUDE_CODE_LOGIN]
      default: API
      description: >-
        ADR 0048: API = called through the LLM gateway and a provider connection. CLAUDE_CODE_LOGIN = Claude Code on the
        benchmark creator's personal runner signed in with their own subscription (LOCAL_LOGIN): provider ANTHROPIC,
        modelId is Claude Code's --model (opus, sonnet, haiku or a full id), coding tasks only, never the judge, nothing
        billed. Such profiles are not offered to workflows.
    ModelProfile:
      allOf:
        - $ref: '#/components/schemas/ModelProfileInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            providerConfigured: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who saved the current version (ADR 0017) }
    ModelTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        usage: { $ref: '#/components/schemas/TokenUsage' }
        cost: { $ref: '#/components/schemas/Money' }
        sample: { type: string }
        error: { type: string, nullable: true }
    ProviderStatus:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        configured: { type: boolean }
        baseUrl: { type: string, nullable: true }
    TaskCategory:
      type: string
      enum: [CODING, ANALYSIS, SPECIFICATION, REVIEW, ARCHITECTURE]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD, EXPERT]
    EvalTaskInput:
      type: object
      required: [name, category, difficulty, kind, instructions, rubric]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/TaskCategory' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        kind: { type: string, enum: [PROMPT, CODING_JOB] }
        instructions: { type: string }
        context: { type: string, nullable: true }
        rubric: { type: string }
        referenceAnswer: { type: string, nullable: true }
        repository:
          type: object
          nullable: true
          properties:
            url: { type: string }
            baseRef: { type: string, description: 'branch, tag or commit; pin a commit so every benchmark sees the same code' }
            setupCommand: { type: string, nullable: true }
            verifyCommand: { type: string }
            acceptance:
              type: object
              nullable: true
              description: >-
                ADR 0047: checks after the agent. files (path -> content) are hidden from the agent and written only for
                the verification (hidden tests, golden files); a tracked file matching protectedPaths (git pathspecs)
                that differs from the base fails the verification; requireChanges fails an untouched work tree.
              properties:
                files: { type: object, additionalProperties: { type: string } }
                protectedPaths: { type: array, items: { type: string } }
                requireChanges: { type: boolean, default: true }
        timeoutSeconds: { type: integer, default: 900 }
        weight: { type: number, default: 1 }
    EvalTask:
      allOf:
        - $ref: '#/components/schemas/EvalTaskInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    TaskSuiteInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        codingScoreWeights:
          type: object
          properties:
            verification: { type: number, default: 0.6 }
            judge: { type: number, default: 0.4 }
    TaskSuiteSummary:
      allOf:
        - $ref: '#/components/schemas/TaskSuiteInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            taskCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who changed the suite or its tasks last }
    TaskSuite:
      allOf:
        - $ref: '#/components/schemas/TaskSuiteSummary'
        - type: object
          properties:
            tasks: { type: array, items: { $ref: '#/components/schemas/EvalTask' } }
    BenchmarkInput:
      type: object
      required: [name, suiteId, modelProfileIds, judgeModelProfileId]
      properties:
        name: { type: string }
        suiteId: { type: string, format: uuid }
        modelProfileIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        judgeModelProfileId: { type: string, format: uuid }
        repetitions: { type: integer, minimum: 1, maximum: 5, default: 1 }
        codingHarness: { type: string, enum: [OPENCODE, CLAUDE_CODE], default: OPENCODE }
        taskIds: { type: array, items: { type: string, format: uuid } }
        runnerTarget: { $ref: '#/components/schemas/RunnerTarget' }
    RunnerTarget:
      type: string
      enum: [SHARED, PERSONAL]
      default: SHARED
      description: 'ADR 0046: where coding jobs run: the shared runner fleet or the personal runner of the user who created the benchmark'
    StepKind:
      type: string
      enum: [LLM_CALL, CODING_AGENT]
      description: 'ADR 0050: LLM_CALL = one call through the gateway (LLM tasks, judges); CODING_AGENT = a runner job'
    ModelOption:
      type: object
      required: [profileId, displayName, provider, modelId, runtime, route, personal, usable]
      properties:
        profileId: { type: string, format: uuid }
        displayName: { type: string }
        provider: { type: string }
        modelId: { type: string }
        runtime: { $ref: '#/components/schemas/ModelRuntime' }
        route: { type: string, enum: [GATEWAY, OWN_LOGIN], description: 'GATEWAY = a provider connection; OWN_LOGIN = the user''s own login on their personal runner' }
        personal: { type: boolean, description: 'usable only by its owner, in private projects and personal benchmarks' }
        usable: { type: boolean }
        problem: { type: string, nullable: true, description: 'why a step cannot run with this model' }
        note: { type: string, nullable: true, description: 'a warning that does not stop the step (e.g. personal runner offline)' }
    ModelDefaults:
      type: object
      required: [platform, mine]
      properties:
        platform: { type: object, additionalProperties: { $ref: '#/components/schemas/ModelProfile' }, description: 'by StepKind' }
        mine: { type: object, additionalProperties: { $ref: '#/components/schemas/ModelProfile' }, description: 'by StepKind' }
    ModelDefaultInput:
      type: object
      required: [stepKind]
      properties:
        stepKind: { $ref: '#/components/schemas/StepKind' }
        profileId: { type: string, format: uuid, nullable: true, description: 'null clears the default' }
    StepModelPlan:
      type: object
      required: [nodeId, nodeName, stepKind, source]
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        stepKind: { $ref: '#/components/schemas/StepKind' }
        harness: { type: string, nullable: true, enum: [OPENCODE, CLAUDE_CODE, null] }
        source: { type: string, enum: [NODE, TEMPLATE, PROJECT, PROJECT_REVIEW, PERSONAL_DEFAULT, PLATFORM_DEFAULT, NONE], description: 'where the model comes from (ADR 0050 step 2: after the project defaults the starting user''s own default, then the platform default)' }
        profileId: { type: string, format: uuid, nullable: true }
        model: { allOf: [ { $ref: '#/components/schemas/ModelOption' } ], nullable: true }
        problem: { type: string, nullable: true, description: 'set = a run of this workflow does not start' }
        note: { type: string, nullable: true }
    ExecutionTarget:
      type: object
      required: [target, pools, onlineRunners]
      properties:
        target: { $ref: '#/components/schemas/RunnerTarget' }
        pools: { type: integer, description: 'runner pools of the target (0 = none set up)' }
        onlineRunners: { type: integer, description: 'runners that called in within the online window' }
        localLogin: { type: boolean, description: 'ADR 0048: a pool of the target lets Claude Code use its owner''s own login (LOCAL_LOGIN)' }
        claudeLogin: { type: boolean, nullable: true, description: 'ADR 0050 step 3: an online runner reported a Claude login (true), every online runner reported none (false), not reported (null)' }
        harnesses: { type: array, items: { type: string }, description: 'ADR 0050 step 3: coding agents the online runners reported' }
    BenchmarkStatus:
      type: string
      enum: [DRAFT, RUNNING, COMPLETED, FAILED, CANCELLED]
    BenchmarkSummary:
      allOf:
        - $ref: '#/components/schemas/BenchmarkInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            suiteName: { type: string }
            status: { $ref: '#/components/schemas/BenchmarkStatus' }
            progress: { type: object, properties: { total: { type: integer }, done: { type: integer }, failed: { type: integer } } }
            totalCost: { $ref: '#/components/schemas/Money' }
            createdAt: { type: string, format: date-time }
            startedAt: { type: string, format: date-time, nullable: true }
            finishedAt: { type: string, format: date-time, nullable: true }
            createdBy: { allOf: [ { $ref: '#/components/schemas/ActorRef' } ], readOnly: true, description: who created the benchmark (ADR 0017) }
    Benchmark:
      allOf:
        - $ref: '#/components/schemas/BenchmarkSummary'
        - type: object
          properties:
            models: { type: array, items: { $ref: '#/components/schemas/ModelProfile' } }
            judge: { $ref: '#/components/schemas/ModelProfile' }
    AttemptStatus:
      type: string
      enum: [PENDING, RUNNING, JUDGING, SUCCEEDED, FAILED, TIMED_OUT]
    Attempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskName: { type: string }
        category: { $ref: '#/components/schemas/TaskCategory' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        modelProfileId: { type: string, format: uuid }
        modelDisplayName: { type: string }
        repetition: { type: integer }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        kind: { type: string, enum: [PROMPT, CODING_JOB] }
        score: { type: number, nullable: true }
        passed: { type: boolean, nullable: true }
        usage: { $ref: '#/components/schemas/TokenUsage' }
        cost: { $ref: '#/components/schemas/Money' }
        durationMs: { type: integer, format: int64, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AttemptDetail:
      allOf:
        - $ref: '#/components/schemas/Attempt'
        - type: object
          properties:
            output: { type: string, nullable: true }
            judgeRationale: { type: string, nullable: true }
            judgeCriteria: { type: array, items: { type: object, properties: { name: { type: string }, score: { type: number }, comment: { type: string } } } }
            verification: { type: object, nullable: true, properties: { command: { type: string }, exitCode: { type: integer }, outputTail: { type: string } } }
            runnerJobId: { type: string, format: uuid, nullable: true }
            error: { type: string, nullable: true }
    LeaderboardRow:
      type: object
      properties:
        modelProfileId: { type: string, format: uuid }
        modelDisplayName: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        attempts: { type: integer }
        meanScore: { type: number, nullable: true }
        passRate: { type: number, nullable: true }
        meanCost: { $ref: '#/components/schemas/Money' }
        totalCost: { $ref: '#/components/schemas/Money' }
        scorePerDollar: { type: number, nullable: true }
        p50LatencyMs: { type: integer, format: int64, nullable: true, description: 'ADR 0046: median of the candidate''s own time (model answer or agent job) in succeeded attempts' }
        p95LatencyMs: { type: integer, format: int64, nullable: true }
        latencySamples: { type: integer, description: 'succeeded attempts the latencies are computed from' }
        stability: { type: number, nullable: true }
    Leaderboard:
      type: object
      properties:
        benchmarkId: { type: string, format: uuid }
        overall: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } }
        byCategory: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } } }
        byDifficulty: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } } }
        byTask:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string, format: uuid }
              taskName: { type: string }
              rows: { type: array, items: { $ref: '#/components/schemas/LeaderboardRow' } }

    # ---- usage / settings / events / runner
    UsageSummary:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        totalUsage: { $ref: '#/components/schemas/TokenUsage' }
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              cost: { $ref: '#/components/schemas/Money' }
              usage: { $ref: '#/components/schemas/TokenUsage' }
              calls: { type: integer }
    UsageEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        modelRef: { $ref: '#/components/schemas/ModelRef' }
        usage: { $ref: '#/components/schemas/TokenUsage' }
        cost: { $ref: '#/components/schemas/Money' }
        estimatedCost: { $ref: '#/components/schemas/Money' }
        durationMs: { type: integer, format: int64, nullable: true }
        context:
          type: object
          properties:
            kind: { type: string, enum: [PIPELINE_STEP, CODE_REVIEW, BENCHMARK_ATTEMPT, MODEL_TEST] }
            projectId: { type: string, format: uuid, nullable: true }
            runId: { type: string, format: uuid, nullable: true }
            stepId: { type: string, nullable: true }
            benchmarkId: { type: string, format: uuid, nullable: true }
            attemptId: { type: string, format: uuid, nullable: true }
            reviewId: { type: string, format: uuid, nullable: true }
    UsageEntryPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/UsageEntry' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    IntegrationsStatus:
      type: object
      properties:
        jira:
          type: object
          properties:
            configured: { type: boolean, description: 'a legacy credential or at least one platform connection exists' }
            url: { type: string, nullable: true, description: site URL of the legacy credential }
            legacy: { type: boolean, description: 'the legacy JIRA_URL / JIRA_EMAIL / JIRA_API_TOKEN credential is set (migrate to scoped connections, ADR 0030)' }
            platformConnections: { type: integer, description: number of platform Jira connections }
        runner: { type: object, properties: { mode: { type: string, enum: [KUBERNETES, DOCKER, DISABLED] }, image: { type: string }, namespace: { type: string, nullable: true } } }
        langfuse: { type: object, properties: { enabled: { type: boolean }, url: { type: string, nullable: true } } }
        ci: { type: object, properties: { scriptUrl: { type: string }, version: { type: string } } }
        providers: { type: array, items: { $ref: '#/components/schemas/ProviderStatus' } }
    IntegrationTestResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
        latencyMs: { type: integer, format: int64, nullable: true }

    # ---- connections (ADR 0030)
    ConnectionType: { type: string, enum: [JIRA] }
    ConnectionScope: { type: string, enum: [PLATFORM, PROJECT, USER], description: 'USER = personal connection (ADR 0035)' }
    JiraTokenKind:
      type: string
      enum: [CLASSIC, SCOPED]
      description: >
        ADR 0035. CLASSIC: a classic Atlassian API token (every permission of its account), sent to the site URL.
        SCOPED: an "API token with scopes", sent to https://api.atlassian.com/ex/jira/{cloudId}; limited to its scopes.
    ConnectionCapability:
      type: string
      enum: [ISSUE_READ, ISSUE_COMMENT, ISSUE_TRANSITION]
      description: >
        What Back Office may do with a connection. ISSUE_READ: read issues (Jira Browse Projects); ISSUE_COMMENT: comment
        (Browse Projects + Add Comments); ISSUE_TRANSITION: move issues through the workflow (Browse Projects + Transition
        Issues). COMMENT and TRANSITION are writes. More values may be added; clients must tolerate unknown ones.
    JiraPermission:
      type: string
      enum: [BROWSE_PROJECTS, ADD_COMMENTS, TRANSITION_ISSUES, EDIT_ISSUES, DELETE_ISSUES, ASSIGN_ISSUES, CREATE_ISSUES, ADMINISTER_PROJECTS, MANAGE_WATCHERS]
    ConnectionInput:
      type: object
      required: [type, name, siteUrl, accountEmail, capabilities]
      properties:
        type: { $ref: '#/components/schemas/ConnectionType' }
        name: { type: string, minLength: 1, maxLength: 80, example: Jira reader }
        siteUrl: { type: string, example: 'https://acme.atlassian.net', description: 'https URL of the Jira Cloud site' }
        accountEmail: { type: string, example: backoffice-jira-reader@acme.com }
        secret: { type: string, writeOnly: true, nullable: true, description: 'classic Atlassian API token; required on create, omitted on update = keep the stored one. Never returned.' }
        capabilities: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/ConnectionCapability' } }
        allowedProjectKeys: { type: array, items: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,19}$' }, description: 'Jira project keys this connection may touch; empty = any' }
        secretExpiresAt: { type: string, format: date, nullable: true, description: expiry date of the API token (reminder) }
        verifyProjectKey: { type: string, nullable: true, description: 'Jira project key used for verification when allowedProjectKeys is empty' }
        tokenKind: { $ref: '#/components/schemas/JiraTokenKind' }
        cloudId: { type: string, nullable: true, description: 'SCOPED: the site''s cloud id; omitted = discovered from <site>/_edge/tenant_info on save' }
        tokenScopes: { type: array, items: { type: string }, maxItems: 100, description: 'SCOPED: the scopes chosen when the token was created (required)' }
        acknowledgeClassicToken: { type: boolean, description: 'CLASSIC: the person confirms the token can do everything its account can (required to save a classic token unless already acknowledged)' }
    ConnectionSecretInput:
      type: object
      required: [secret]
      properties:
        secret: { type: string, writeOnly: true, minLength: 1 }
        secretExpiresAt: { type: string, format: date, nullable: true }
    ConnectionVerifyRequest:
      type: object
      properties:
        projectKey: { type: string, nullable: true, description: 'sample Jira project key; default: allowedProjectKeys, else verifyProjectKey' }
    Connection:
      type: object
      required: [id, scope, type, name, siteUrl, accountEmail, capabilities, allowedProjectKeys, secretSet, legacy, expiryStatus]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ConnectionScope' }
        projectId: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/ConnectionType' }
        name: { type: string }
        siteUrl: { type: string }
        accountEmail: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/ConnectionCapability' } }
        allowedProjectKeys: { type: array, items: { type: string } }
        verifyProjectKey: { type: string, nullable: true }
        secretSet: { type: boolean, description: 'a secret is stored (its value is never returned)' }
        secretRotatedAt: { type: string, format: date-time, nullable: true }
        secretExpiresAt: { type: string, format: date, nullable: true }
        expiryStatus: { type: string, enum: [NONE, OK, EXPIRING_SOON, EXPIRED], description: 'EXPIRING_SOON = within 30 days' }
        legacy: { type: boolean, description: 'the JIRA_* environment-variable credential; read-only, all capabilities' }
        createdAt: { type: string, format: date-time, nullable: true }
        createdBy: { $ref: '#/components/schemas/ActorRef' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { $ref: '#/components/schemas/ActorRef' }
        verification: { $ref: '#/components/schemas/ConnectionVerification' }
        tokenKind: { $ref: '#/components/schemas/JiraTokenKind' }
        cloudId: { type: string, nullable: true }
        tokenScopes: { type: array, items: { type: string } }
        classicTokenAcknowledged: { type: boolean }
        ownerUserId: { type: string, format: uuid, nullable: true, description: 'USER scope: the owner' }
        ownerName: { type: string, nullable: true }
    PersonalConnectionSummary:
      type: object
      description: 'What administrators see of a personal connection (ADR 0035): no e-mail, never usable by them.'
      required: [id, name, siteUrl, capabilities, tokenKind, expiryStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        siteUrl: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/ConnectionCapability' } }
        tokenKind: { $ref: '#/components/schemas/JiraTokenKind' }
        ownerUserId: { type: string, format: uuid, nullable: true }
        ownerName: { type: string, nullable: true }
        secretExpiresAt: { type: string, format: date, nullable: true }
        expiryStatus: { type: string, enum: [NONE, OK, EXPIRING_SOON, EXPIRED] }
        verificationStatus: { type: string, enum: [OK, WARNING, FAILED], nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    JiraScopeOption:
      type: object
      required: [kind, required, recommended]
      properties:
        kind: { type: string, enum: [CLASSIC, GRANULAR] }
        required: { type: array, items: { type: string } }
        recommended: { type: array, items: { type: string } }
    JiraScopes:
      type: object
      required: [verification, capabilities]
      properties:
        verification: { type: array, items: { $ref: '#/components/schemas/JiraScopeOption' } }
        capabilities: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/JiraScopeOption' } } }
    ProjectJiraConnectionsInput:
      type: object
      properties:
        systemConnectionId: { type: string, format: uuid, nullable: true, description: 'a project or platform connection; null = no system connection (the ADR 0030 rule applies)' }
        additionalConnectionIds: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: 'ordered; not containing the system connection' }
    ProjectJiraConnections:
      type: object
      required: [additionalConnectionIds, additionalConnections, available]
      properties:
        systemConnectionId: { type: string, format: uuid, nullable: true }
        additionalConnectionIds: { type: array, items: { type: string, format: uuid } }
        systemConnection: { allOf: [ { $ref: '#/components/schemas/Connection' } ], nullable: true }
        additionalConnections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        available: { type: array, items: { $ref: '#/components/schemas/Connection' }, description: project and platform connections that can be chosen }
    SpecKitStatus:
      type: object
      required: [enabled, allowedByPlatform, effective, missingWorkflows]
      properties:
        enabled: { type: boolean, description: the project setting }
        allowedByPlatform: { type: boolean }
        effective: { type: boolean, description: enabled and allowed }
        missingWorkflows: { type: array, items: { type: string }, description: 'seeded Spec Kit workflows the project lacks ("Add Spec Kit workflows")' }
    ScmCapability:
      type: string
      enum: [GIT_READ, CI_READ, PUSH_BRANCH, MR_WRITE, MR_COMMENT, PIPELINE_RUN]
      description: >-
        ADR 0051. Read capabilities (GIT_READ: clone, CI_READ: pipelines and job logs) may reach an agent as a tool when
        the token is verified read-only; write capabilities (PUSH_BRANCH, MR_WRITE, MR_COMMENT, PIPELINE_RUN) are used
        only by platform code. GitLab needs: GIT_READ read_repository + Reporter, CI_READ read_api + Reporter,
        PUSH_BRANCH write_repository + Developer, MR_COMMENT api + Reporter, MR_WRITE and PIPELINE_RUN api + Developer.
    ScmConnectionInput:
      type: object
      required: [repositoryKey, name, capabilities]
      properties:
        repositoryKey: { type: string, description: key of one of the project's repositories }
        name: { type: string, maxLength: 80, description: unique in the project }
        provider: { type: string, enum: [GITLAB], default: GITLAB }
        capabilities: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ScmCapability' } }
        token: { type: string, nullable: true, maxLength: 4096, description: 'project or group access token; required on create and test, omitted on update = keep the stored one' }
        secretExpiresAt: { type: string, format: date, nullable: true, description: omitted = the expiry GitLab reports for the token }
    ScmConnection:
      type: object
      required: [id, repositoryKey, repositoryExists, name, provider, capabilities, expiryStatus, readOnly, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id: { type: string, format: uuid }
        repositoryKey: { type: string }
        repositoryExists: { type: boolean, description: false when the repository was removed from the project (never selected) }
        name: { type: string }
        provider: { type: string, enum: [GITLAB] }
        capabilities: { type: array, items: { $ref: '#/components/schemas/ScmCapability' } }
        secretExpiresAt: { type: string, format: date, nullable: true }
        expiryStatus: { type: string, enum: [NONE, OK, EXPIRING_SOON, EXPIRED] }
        readOnly: { type: boolean, description: 'declared read-only and verified without write powers: the only kind an agent tool may receive' }
        verification: { $ref: '#/components/schemas/ScmVerification' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    ScmVerification:
      type: object
      nullable: true
      required: [status, checkedAt, granted, missing, writePowers, messages]
      properties:
        status: { type: string, enum: [OK, WARNING, FAILED], description: 'FAILED: unreachable, refused or a declared capability is missing; WARNING: more rights than declared, unprotected default branch or too high a role' }
        checkedAt: { type: string, format: date-time }
        tokenName: { type: string, nullable: true }
        scopes: { type: array, nullable: true, items: { type: string }, description: null when the token cannot call the API }
        role: { type: string, nullable: true, description: 'Guest, Reporter, Developer, Maintainer or Owner' }
        tokenExpiresAt: { type: string, format: date, nullable: true }
        granted: { type: array, items: { $ref: '#/components/schemas/ScmCapability' } }
        missing: { type: array, items: { $ref: '#/components/schemas/ScmCapability' } }
        writePowers: { type: array, items: { type: string }, description: 'writes beyond the declared capabilities, e.g. "git push", "api scope", "merge into main"' }
        messages: { type: array, items: { $ref: '#/components/schemas/ScmMessage' } }
    ScmMessage:
      type: object
      required: [severity, code, text]
      properties:
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        code: { type: string, description: 'UNREACHABLE, MISSING_<capability>, EXCESS, UNPROTECTED_DEFAULT_BRANCH, ROLE_TOO_HIGH, NO_API' }
        text: { type: string, description: English text }
    ConnectionVerification:
      type: object
      nullable: true
      required: [status, checkedAt, projects, missing, excess, messages]
      properties:
        status: { type: string, enum: [OK, WARNING, FAILED], description: 'FAILED: authentication failed or permissions for declared capabilities are missing; WARNING: over-privileged or nothing to check' }
        checkedAt: { type: string, format: date-time }
        account:
          type: object
          nullable: true
          properties:
            accountId: { type: string }
            displayName: { type: string }
            emailAddress: { type: string, nullable: true }
        projects: { type: array, items: { $ref: '#/components/schemas/ConnectionProjectCheck' } }
        missing: { type: array, items: { $ref: '#/components/schemas/JiraPermission' }, description: needed by the declared capabilities but not granted (any project) }
        excess: { type: array, items: { $ref: '#/components/schemas/JiraPermission' }, description: granted beyond the declared capabilities (any project) }
        messages: { type: array, items: { $ref: '#/components/schemas/ConnectionMessage' } }
    ConnectionProjectCheck:
      type: object
      required: [projectKey, granted, missing, excess]
      properties:
        projectKey: { type: string }
        granted: { type: array, items: { $ref: '#/components/schemas/JiraPermission' } }
        missing: { type: array, items: { $ref: '#/components/schemas/JiraPermission' } }
        excess: { type: array, items: { $ref: '#/components/schemas/JiraPermission' } }
    ConnectionMessage:
      type: object
      required: [severity, code, text]
      properties:
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        code:
          type: string
          enum: [AUTHENTICATION_FAILED, SITE_UNREACHABLE, HTTP_ERROR, PROJECT_NOT_FOUND, NO_PROJECT_TO_CHECK, MISSING_PERMISSIONS, EXCESS_PERMISSIONS, SECRET_UNAVAILABLE, VERIFIED, MISSING_SCOPES, EXCESS_SCOPES, BROAD_SCOPE]
        projectKey: { type: string, nullable: true }
        permissions: { type: array, items: { $ref: '#/components/schemas/JiraPermission' } }
        text: { type: string, description: English text (the UI renders its own from code, projectKey and permissions) }
    ConnectionTestRequest:
      type: object
      required: [connection]
      properties:
        connection: { $ref: '#/components/schemas/ConnectionInput' }
        connectionId: { type: string, format: uuid, nullable: true, description: 'an existing connection: its stored secret is used when the draft has none' }
        projectKey: { type: string, nullable: true, description: sample Jira project key for the permission check }
    JiraIntakeInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        pollIntervalMinutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
        workflowId: { type: string, format: uuid, nullable: true, description: 'workflow to start; required when enabled, needs a JIRA_TRANSITION trigger' }
    JiraIntake:
      type: object
      required: [enabled, pollIntervalMinutes, connection, problems, status, canManage]
      properties:
        enabled: { type: boolean }
        pollIntervalMinutes: { type: integer }
        workflowId: { type: string, format: uuid, nullable: true }
        workflowName: { type: string, nullable: true }
        triggerStatus: { type: string, nullable: true, description: 'status of the workflow''s JIRA_TRANSITION trigger; null = new issues' }
        mode: { type: string, enum: [TRANSITION, NEW_ISSUE], nullable: true }
        jql: { type: string, nullable: true, description: 'the query the watcher sends (window shown for one poll interval); the project''s Jira key and JQL filter, plus the connection''s allow-list' }
        connection: { $ref: '#/components/schemas/ConnectionResolution' }
        problems: { type: array, items: { type: string }, description: why the watcher cannot poll or start runs right now }
        status: { $ref: '#/components/schemas/JiraIntakeStatus' }
        canManage: { type: boolean, readOnly: true, description: 'the caller holds project.manage (configure, Poll now)' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { $ref: '#/components/schemas/ActorRef' }
    JiraIntakeStatus:
      type: object
      required: [baselineTaken, consecutiveFailures, issuesStarted]
      properties:
        baselineTaken: { type: boolean, description: 'false until the first poll after enabling (it only records the starting point)' }
        cursor: { type: string, format: date-time, nullable: true }
        lastPollAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        consecutiveFailures: { type: integer, description: 'back-off: the poll interval doubles per failure (max 1 h), Retry-After honoured' }
        nextPollAt: { type: string, format: date-time, nullable: true }
        issuesStarted: { type: integer, format: int64 }
        lastConnection: { type: string, nullable: true }
        lastWarning: { type: string, nullable: true, description: 'least-privilege warning (the connection has more than ISSUE_READ)' }
    ConnectionResolution:
      type: object
      required: [status, required, excess, pinned, message]
      properties:
        status: { type: string, enum: [OK, OVER_PRIVILEGED, NONE, PINNED_NOT_FOUND, PINNED_INSUFFICIENT, NO_ACTING_USER, NO_PERSONAL_CONNECTION] }
        mode: { type: string, enum: [SYSTEM, SPECIFIC, ACTING_USER], description: 'ADR 0035: how the step picks its connection' }
        fallback: { type: boolean, description: 'the system connection did not fit; another connection of the project''s list was chosen' }
        required: { type: array, items: { $ref: '#/components/schemas/ConnectionCapability' } }
        connection: { allOf: [ { $ref: '#/components/schemas/Connection' } ], nullable: true }
        pinned: { type: boolean }
        excess: { type: array, items: { $ref: '#/components/schemas/ConnectionCapability' }, description: capabilities of the chosen connection beyond the required ones }
        message: { type: string }
    DomainEventEnvelope:
      type: object
      required: [id, type, occurredAt, payload]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [WorkflowRunStarted, NodeStarted, NodeCompleted, NodeFailed, RunWaitingForHuman, RunWaitingForCi, ApprovalDecided, ApprovalAssigned, CiSignalReceived, WorkflowRunFinished, CiExecutionFinished, RunnerLog, BenchmarkProgress, BenchmarkFinished, BudgetAlert, BudgetExceeded, ConnectionExpiring, IntakeProposalsFound]
          description: >
            RunWaitingForHuman carries `kind` (GATE or WRITE_CONFIRMATION, ADR 0033). BudgetAlert / BudgetExceeded come from
            the llm-gateway budgets. ConnectionExpiring (daily, once per expiry date) carries `connectionId`, `projectId`
            (null = platform or personal), `name`, `scope` (PLATFORM / PROJECT / USER), `ownerUserId` (USER only: the
            owner, the only person notified, ADR 0035), `expiresAt`, `daysLeft`. IntakeProposalsFound (ADR 0038) carries
            `ownerUserId` (the only person notified), `ruleId`, `ruleName`, `count` and `issueKeys` (at most 5).
        occurredAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    RunnerEvent:
      type: object
      required: [type, message, at]
      properties:
        type: { type: string, enum: [LOG, PROGRESS] }
        message: { type: string }
        at: { type: string, format: date-time }
    RunnerResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SUCCEEDED, FAILED, TIMED_OUT] }
        summary: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        commitSha: { type: string, nullable: true }
        diffStat: { type: object, nullable: true, properties: { files: { type: integer }, insertions: { type: integer }, deletions: { type: integer } } }
        diff: { type: string, nullable: true, description: 'git diff <baseRef>...HEAD, at most 2 MB' }
        mergeRequestUrl: { type: string, nullable: true, description: parsed from the push output when push options created an MR }
        verification: { type: object, nullable: true, properties: { command: { type: string }, exitCode: { type: integer }, outputTail: { type: string } } }
        artifacts:
          type: array
          items:
            type: object
            required: [name, mediaType, content]
            properties:
              name: { type: string }
              path: { type: string, nullable: true }
              mediaType: { type: string }
              content: { type: string }
        usage:
          allOf:
            - $ref: '#/components/schemas/TokenUsage'
            - type: object
              properties:
                costUsd: { type: number, nullable: true }
                billing: { type: string, enum: [SUBSCRIPTION], nullable: true, description: 'ADR 0040: Claude Code ran with its user own login; costUsd is only its estimate and is not counted as spend' }
        error: { type: string, nullable: true }
        repositories:
          type: array
          nullable: true
          description: >-
            Per-repository result (ADR 0034), one entry per `spec.repositories[]` entry, same `key`. The top-level
            branch / commitSha / diffStat / mergeRequestUrl mirror the primary entry. Absent (older runners): Back
            Office reads the top-level fields as the result of the single (primary) repository.
          items:
            type: object
            required: [key, pushed]
            properties:
              key: { type: string }
              branch: { type: string, nullable: true, description: 'the pushed job branch (PUSH_MR) or the checked-out branch' }
              commitSha: { type: string, nullable: true, description: 'HEAD after the job (the pushed commit for PUSH_MR)' }
              diffStat: { type: object, nullable: true, properties: { files: { type: integer }, insertions: { type: integer }, deletions: { type: integer } } }
              mergeRequestUrl: { type: string, nullable: true }
              pushed: { type: boolean, description: 'true only when the job branch was pushed to this repository' }
              error: { type: string, nullable: true, description: 'clone / commit / push failure of this repository' }
        digests:
          type: object
          nullable: true
          description: 'v2 sandboxes; lowercase hex SHA-256 of the full diff (before the 2 MB cap) and of the complete runner log'
          properties:
            diffSha256: { type: string }
            logSha256: { type: string }
        policy:
          type: object
          nullable: true
          description: 'tool policy report of unattended jobs: ask patterns treated as deny, and tool calls the agent reported as refused'
          properties:
            askTreatedAsDeny: { type: array, items: { type: string } }
            denials: { type: array, items: { type: object, properties: { tool: { type: string }, input: { type: string } } } }
    RunnerPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string, description: base64 of the 32-byte raw X25519 public key }
    JobCredentials:
      type: object
      required: [expiresAt, credentials]
      properties:
        expiresAt: { type: string, format: date-time, description: part of every token's associated data; the controller refuses the answer after it }
        credentials:
          type: array
          items:
            type: object
            required: [ref, repository, capability, enc, ciphertext]
            properties:
              ref: { type: string }
              repository: { type: string, description: 'repositories[].key of the spec ("" = the legacy single repository)' }
              capability: { type: string, enum: [GIT_READ, PUSH_BRANCH, CI_READ], description: 'CI_READ = the read-only token of an agent tool (agentTools)' }
              enc: { type: string, description: HPKE encapsulated key, base64 }
              ciphertext: { type: string, description: the sealed token, base64 }
    WorkspaceSync:
      type: object
      description: 'ADR 0044: the run workspaces a runner-controller holds.'
      required: [held]
      properties:
        held: { type: array, items: { type: string } }
    WorkspaceSyncResult:
      type: object
      required: [release]
      properties:
        release: { type: array, items: { type: string }, description: 'workspaces the controller deletes now' }
    RunnerJobSpec:
      description: 'Delivered to the sandbox as `spec.json` of the job bundle (/var/run/backoffice/job, ADR 0024); legacy: base64 JSON in `RUNNER_SPEC`.'
      type: object
      required: [mode, agent, model, prompt, timeoutSeconds]
      properties:
        mode: { type: string, enum: [SPEC_KIT, IMPLEMENT, EVAL_CODING, PROMPT], description: 'PROMPT (ADR 0050 step 4): one answer of Claude Code without a repository or tools, returned as the response artefact' }
        agent: { type: string, enum: [OPENCODE, CLAUDE_CODE] }
        model: { $ref: '#/components/schemas/ModelRef' }
        repositories:
          type: array
          nullable: true
          description: >-
            Repositories of the job (ADR 0034). The workspace root is /workspace; each entry is cloned into
            /workspace/<path>; the agent works in the path of the `primary` entry (/workspace when the list is empty).
            Exactly one entry is primary when the list is not empty. Omitted for jobs built the legacy way (coding
            benchmarks, older Back Office): the runner then uses `repository`. When present, `repository` mirrors the
            primary entry and `gitAccess` is the highest access among the entries, for older runners.
          items: { $ref: '#/components/schemas/JobRepository' }
        repository:
          type: object
          nullable: true
          description: 'legacy single repository; mirrors the primary `repositories[]` entry when that list is present'
          properties:
            url: { type: string }
            baseRef: { type: string }
            branch: { type: string, nullable: true }
            push: { type: boolean, default: false }
            mergeRequest:
              type: object
              nullable: true
              properties:
                create: { type: boolean, default: true }
                title: { type: string }
                description: { type: string, nullable: true }
                targetBranch: { type: string }
                draft: { type: boolean, default: false }
        specKitPhase: { type: string, enum: [SPECIFY, CLARIFY, PLAN, TASKS, ANALYZE, IMPLEMENT], nullable: true }
        prompt: { type: string }
        constitution: { type: string, nullable: true }
        systemPrompt: { type: string, nullable: true, description: 'ADR 0050 step 4: the system prompt of a PROMPT job (prompt is then the user message)' }
        setupCommand: { type: string, nullable: true }
        verifyCommand: { type: string, nullable: true }
        timeoutSeconds: { type: integer }
        collectArtifacts: { type: array, items: { type: string } }
        collectDiff: { type: boolean, default: true }
        skills: { type: array, items: { type: object, required: [key, name, content], properties: { key: { type: string }, name: { type: string }, content: { type: string } } } }
        runId: { type: string, format: uuid, nullable: true, description: written as the `Back-Office-Run` git trailer }
        gitAccess: { $ref: '#/components/schemas/GitAccess' }
        specKit:
          type: boolean
          nullable: true
          description: >-
            ADR 0036: false = the project does not use Spec Kit: no `specify init`, no constitution, no `/speckit.*`
            commands (a SPEC_KIT job with false is refused). Null/omitted (legacy-built jobs, older Back Office): the
            runner's earlier behaviour. Covered by the spec digest when present.
        workspace:
          type: object
          nullable: true
          description: >-
            ADR 0044: the run workspace of the job. The controller mounts the volume / PVC `name` at /workspace instead of
            a throwaway one (backends without workspaces log it and use a throwaway one); the runner reuses clones it made
            there for earlier jobs (rewriting .git/config first) and keeps their working trees. `sessionRole` continues the
            coding agent's session of that role (Claude Code --session-id / --resume, OpenCode --continue); `prepareOnly`
            clones and runs setupCommand without an agent. Back Office leases the jobs of one workspace only to the runner
            holding it, one at a time. Omitted = a throwaway workspace. Covered by the spec digest when present.
          required: [name, key]
          properties:
            name: { type: string, pattern: '^bo-ws-[0-9a-f]{32}-[a-z][a-z0-9-]{0,19}$' }
            key: { type: string, pattern: '^[a-z][a-z0-9-]{0,19}$' }
            sessionRole: { type: string, nullable: true, pattern: '^[a-z][a-z0-9-]{0,19}$' }
            prepareOnly: { type: boolean, nullable: true }
            setupCommand: { type: string, nullable: true, description: 'the workspace setup; run once per workspace, again when it changes' }
        llmCredentials:
          type: string
          enum: [GATEWAY, LOCAL_LOGIN]
          nullable: true
          description: >-
            ADR 0040, v2 assignments of personal pools: LOCAL_LOGIN = Claude Code uses the owner's own login, delivered by
            the controller as the bundle file claude-login-token, and reaches api.anthropic.com directly. Omitted = the
            gateway. Covered by the spec digest when present.
        gateway:
          type: object
          nullable: true
          description: 'set in v2 assignments; the sandbox uses these instead of provider keys'
          properties:
            anthropicBaseUrl: { type: string }
            openaiBaseUrl: { type: string }
            apiBaseUrl: { type: string }
        credentials:
          type: array
          nullable: true
          description: >-
            ADR 0051: project repository tokens of the job, by name only (never values): the controller fetches them
            sealed with POST /runner/v2/jobs/{jobId}/credentials before the sandbox starts and delivers each as the
            token of its repository. Absent = the runner pool's own git tokens (deprecated fallback). Covered by the
            spec digest when present.
          items:
            type: object
            required: [ref, repository, capability]
            properties:
              ref: { type: string, description: the repository token (its connection id) }
              repository: { type: string }
              capability: { type: string, enum: [GIT_READ, PUSH_BRANCH, CI_READ] }
        agentTools:
          type: array
          nullable: true
          description: >-
            ADR 0051 step 4: read-only tools of the agent. gitlab-read = glab (GITLAB_TOKEN, GITLAB_HOST) with the CI_READ
            token of the repository, named in credentials and delivered as the bundle file tool-token-<repository>; the
            runner hands only this token to the agent and redacts it everywhere. Covered by the spec digest when present.
          items:
            type: object
            required: [name, repository]
            properties:
              name: { type: string, enum: [gitlab-read] }
              repository: { type: string }
    JobRepository:
      type: object
      description: >-
        One repository of a runner job (ADR 0034). Signed with the spec (specDigest covers it). Access is per entry:
        READ = clone and fetch only (push URL disabled, never pushed); PUSH_MR = push `pushBranch` and open the merge
        request with whitelisted push options, never merge (ADR 0031). The runner-controller selects the credential per
        entry (url + access) as for the legacy single repository.
      required: [key, url, baseBranch, access, path, primary]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,30}$', description: project repository key }
        url: { type: string }
        baseBranch: { type: string, description: 'branch checked out before the agent starts; diffs are against it; never pushed to' }
        access: { type: string, enum: [NONE, READ, PUSH_MR], description: 'GitAccess of this entry; Back Office sends READ or PUSH_MR' }
        path: { type: string, description: 'workspace subdirectory (relative to /workspace); equals key' }
        pushBranch: { type: string, nullable: true, description: 'the job branch; only for PUSH_MR, never the base branch' }
        mergeRequest:
          type: object
          nullable: true
          description: 'only for PUSH_MR; target branch = baseBranch'
          properties:
            create: { type: boolean, default: true }
            title: { type: string }
            description: { type: string, nullable: true }
            draft: { type: boolean, default: false }
        primary: { type: boolean, description: 'exactly one entry: the agent working directory and the legacy mirror' }
