openapi: 3.1.0
info:
  title: Back Office API
  version: 4.2.0
  description: |
    Contract between the Angular UI, the backend, the project CI (through `backoffice-ci.sh`) and the
    agent runner. Browser calls authenticate with the `BO_SESSION` cookie set by the OIDC login
    (`/oauth2/authorization/oidc`) or by the local login (`POST /auth/login`, ADR 0021) and send `X-XSRF-TOKEN` on unsafe methods; scripts use a personal
    access token (`Authorization: Bearer bo_pat_...`). `ci/**` uses project CI tokens, `internal/runner/**`
    per-job tokens. Every operation checks a permission (see docs/architecture/08-identity-and-access.md);
    `403` bodies carry `permission` and optionally `projectId`. Errors use RFC 9457 problem details and every
    response carries `X-Correlation-Id`.
servers:
  - url: /api/v1
security:
  - Session: []
  - PersonalToken: []
tags:
  - name: runner-v2
    description: Pull-based runner fleet protocol (ADR 0024, docs/architecture/10-agent-execution.md)
  - name: llm-proxy
    description: Provider-compatible LLM endpoints for sandboxed agents (job tokens only)
  - name: fleet
  - name: operations
  - name: budgets
  - name: insights
  - name: provenance
  - name: auth
  - name: admin
  - name: members
  - name: tokens
  - name: audit
  - name: dashboard
  - name: projects
  - name: ci-tokens
  - name: workflows
  - name: runs
  - name: approvals
  - name: ci
  - name: task-library
  - name: my-work
    description: Personal work (ADR 0038), personal Jira intake rules and the run proposals they create
  - name: workflow-library
    description: Versioned workflows published from projects and adopted by other projects as linked copies (ADR 0037)
  - name: project-workspaces
    description: Run workspaces of a project shared by its workflows (sources, setup, agent roles; ADR 0044)
  - name: library-sources
    description: Sources of the library (git repositories of standards, templates, reference material) that steps of every project attach read-only (ADR 0043)
  - name: llm-providers
    description: LLM provider connections with sealed API keys, managed in Back Office (ADR 0045)
  - name: model-profiles
  - name: task-suites
  - name: benchmarks
  - name: usage
  - name: settings
  - name: connections
    description: Least-privilege credentials for external systems (Jira), scoped to the platform or a project (ADR 0030)
  - name: jira-intake
    description: Jira intake watcher of a project, reading with an ISSUE_READ connection only (ADR 0033)
  - name: events
  - name: runner-internal

paths:
  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      responses:
        '200': { description: Summary for the landing page, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }

  # ---------------------------------------------------------------- auth / current user
  /me:
    get:
      tags: [auth]
      operationId: getMe
      description: Current identity with effective permissions. 401 when there is no session.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/preferences:
    put:
      tags: [auth]
      operationId: updateMyPreferences
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      security: []
      description: Public. Login URL, provider name, registration mode; used by the login page.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthConfig' } } } }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Invalidates the session and returns the identity provider's end-session URL to navigate to.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { logoutUrl: { type: string, nullable: true } } } } } }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSessionInfo
      description: Remaining idle and absolute session time; does not extend the session.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } } }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginLocal
      security: []
      description: |
        Local e-mail + password login (ADR 0021). Creates the same `BO_SESSION` as the OIDC login. Wrong
        e-mail, wrong password, inactive account and accounts that may not use local login all return the
        same 401 `invalid-credentials` with equalised timing. Throttling returns 429 `too-many-attempts`
        with `Retry-After`. Needs the `XSRF-TOKEN` cookie/header like any unsafe call (fetch `/auth/config` first).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalLoginRequest' } } } }
      responses:
        '200': { description: Step result, content: { application/json: { schema: { $ref: '#/components/schemas/LoginStepResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/login/mfa:
    post:
      tags: [auth]
      operationId: loginMfa
      security: []
      description: Second step when the first returned `MFA_REQUIRED`. Accepts a TOTP code or one recovery code.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaLoginRequest' } } } }
      responses:
        '200': { description: Step result, content: { application/json: { schema: { $ref: '#/components/schemas/LoginStepResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      description: Change own password (also the forced change after a reset or a first login). Terminates the user's other sessions.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/password/reset/{token}:
    parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [auth]
      operationId: checkPasswordResetToken
      security: []
      description: Validates a set-password / reset link; returns the e-mail it belongs to and the password policy.
      responses:
        '200': { description: Valid, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetInfo' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [auth]
      operationId: completePasswordReset
      security: []
      description: Sets a new password with a one-time link issued by an administrator (or for an invited local user). Signs the user in unless MFA is required.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [newPassword], properties: { newPassword: { type: string, format: password } } } } } }
      responses:
        '200': { description: Password set, content: { application/json: { schema: { $ref: '#/components/schemas/LoginStepResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/security:
    get:
      tags: [auth]
      operationId: getMySecurity
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MySecurity' } } } }
  /me/mfa/totp:
    post:
      tags: [auth]
      operationId: startTotpEnrolment
      description: Starts TOTP enrolment; returns the secret and an otpauth URI (plus an inline SVG QR code). Not active until confirmed.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrolment' } } } }
    put:
      tags: [auth]
      operationId: confirmTotpEnrolment
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses:
        '200': { description: MFA enabled; recovery codes shown once, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: disableTotp
      description: Needs the current password. Refused (409) when the platform requires MFA for local accounts.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentPassword], properties: { currentPassword: { type: string, format: password } } } } } }
      responses:
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/mfa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      description: Invalidates the old codes and returns 10 new ones (shown once). Needs the current password.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentPassword], properties: { currentPassword: { type: string, format: password } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
  /admin/users/{userId}/auth:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    put:
      tags: [admin]
      operationId: setUserAuthMode
      description: Chooses how the user may sign in. Switching to LOCAL or BOTH without a password returns a set-password link.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [authMode], properties: { authMode: { $ref: '#/components/schemas/AuthMode' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/password-reset:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    post:
      tags: [admin]
      operationId: issuePasswordReset
      description: Issues a one-time set-password link (default 24 h) to hand to the user; the current password stops working immediately and sessions are terminated.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetLink' } } } }
  /admin/users/{userId}/mfa:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    delete:
      tags: [admin]
      operationId: resetUserMfa
      description: Removes the user's TOTP and recovery codes (lost device). Audited.
      responses:
        '204': { description: Reset }
  /admin/users/{userId}/unlock:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    post:
      tags: [admin]
      operationId: unlockUser
      description: Clears the failed-login lockout of a local account.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }

  # ---------------------------------------------------------------- runner fleet v2 (ADR 0024)
  /runner/v2/register:
    post:
      tags: [runner-v2]
      operationId: registerRunner
      security: []
      description: 'Called by a runner-controller with a single-use registration token (`bo_rrt_`) issued for a pool. Returns the runner token (`bo_rt_`) used for every other runner call.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerRegistration' } } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerRegistered' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /runner/v2/config:
    get:
      tags: [runner-v2]
      operationId: getRunnerConfig
      security: [ { RunnerFleetToken: [] } ]
      responses:
        '200': { description: Pool configuration, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerConfig' } } } }
  /runner/v2/jobs/lease:
    post:
      tags: [runner-v2]
      operationId: leaseAgentJobs
      security: [ { RunnerFleetToken: [] } ]
      description: 'Long poll (up to `waitSeconds`, max 30). Returns at most `maxJobs` signed assignments for the runner''s pool.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseRequest' } } } }
      responses:
        '200': { description: Assignments (possibly empty), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgentJobAssignment' } } } } }
  /runner/v2/jobs/{jobId}/heartbeat:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-v2]
      operationId: heartbeatAgentJob
      security: [ { RunnerFleetToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobHeartbeat' } } } }
      responses:
        '200': { description: Lease extended, content: { application/json: { schema: { $ref: '#/components/schemas/JobHeartbeatResponse' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /runner/v2/jobs/{jobId}/complete:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-v2]
      operationId: completeAgentJob
      security: [ { RunnerFleetToken: [] } ]
      description: Terminal status as seen by the controller (the agent result arrives separately with the job token).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobCompletion' } } } }
      responses:
        '202': { description: Accepted }
        '409': { $ref: '#/components/responses/Problem' }
  /runner/v2/jobs/{jobId}/uploads:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-v2]
      operationId: createJobUpload
      security: [ { RunnerToken: [] } ]
      description: Presigned object-storage URL for a large artefact or log (job token).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadRequest' } } } }
      responses:
        '200': { description: Upload target, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTarget' } } } }
  /runner/v2/workspaces/sync:
    post:
      tags: [runner-v2]
      operationId: syncRunWorkspaces
      security: [ { RunnerFleetToken: [] } ]
      description: >-
        ADR 0044: the run workspaces (Docker volumes / PVCs named bo-ws-...) this runner-controller holds. The answer
        names the ones it deletes: released by Back Office (run ended, or 24 h after it failed), unknown, or now held by
        another runner. Rows of this runner whose volume is gone are forgotten (the next job starts an empty workspace).
        Called about once a minute; a controller that cannot list its volumes does not call it.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceSync' } } } }
      responses:
        '200': { description: Workspaces to delete, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceSyncResult' } } } }
  /runner/v2/key:
    put:
      tags: [runner-v2]
      operationId: setRunnerPublicKey
      security: [ { RunnerFleetToken: [] } ]
      description: >-
        ADR 0051: the controller's X25519 public key (base64 of the raw 32 bytes) the project repository tokens of its
        jobs are sealed to. Sent on every start; idempotent; a new key replaces the old one (audited
        `RUNNER_PUBLIC_KEY_SET`). The private key never leaves the controller.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPublicKey' } } } }
      responses:
        '204': { description: Stored }
        '400': { $ref: '#/components/responses/Problem' }
  /runner/v2/jobs/{jobId}/credentials:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [runner-v2]
      operationId: releaseJobCredentials
      security: [ { RunnerFleetToken: [] } ]
      description: >-
        ADR 0051: the project repository tokens named in the job's signed spec (`credentials`), each sealed to the
        runner's public key with HPKE (RFC 9180 base mode, DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-256-GCM, info
        `back-office credentials v1`, associated data `<jobId>|<ref>|<expiresAt>`). Only for the runner holding the
        job's lease while it is valid, and once per lease (409 otherwise, also when the runner has no key or a token no
        longer exists). Fetched right before the sandbox starts; audited `RUNNER_CREDENTIALS_RELEASED`. Conformance
        vector: docs/api/fixtures/sealed-credential-vector.json.
      responses:
        '200': { description: Sealed tokens (empty list when the spec names none), content: { application/json: { schema: { $ref: '#/components/schemas/JobCredentials' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /runner/v2/pools/{poolId}/queue:
    parameters: [ { name: poolId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [runner-v2]
      operationId: getPoolQueue
      security: [ { RunnerFleetToken: [] } ]
      description: Queue depth for autoscaling (KEDA metrics-api scaler).
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { queued: { type: integer }, running: { type: integer } } } } } }

  # ---------------------------------------------------------------- LLM gateway proxy for sandboxes
  /llm/anthropic/v1/messages:
    post:
      tags: [llm-proxy]
      operationId: proxyAnthropicMessages
      security: [ { RunnerToken: [] } ]
      description: |
        Anthropic Messages API passthrough (streaming and non-streaming) for agents in sandboxes. Auth with
        the job token as `x-api-key` or `Authorization: Bearer`. The model must be on the job's allowlist.
        Usage is metered from the provider response into the ledger; budgets are enforced (402
        `budget-exceeded`). Request and response bodies follow the provider API unchanged.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Provider response or SSE stream, content: { application/json: { schema: { type: object, additionalProperties: true } }, text/event-stream: { schema: { type: string } } } }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /llm/anthropic/v1/messages/count_tokens:
    post:
      tags: [llm-proxy]
      operationId: proxyAnthropicCountTokens
      security: [ { RunnerToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Provider response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /llm/openai/v1/chat/completions:
    post:
      tags: [llm-proxy]
      operationId: proxyOpenAiChatCompletions
      security: [ { RunnerToken: [] } ]
      description: OpenAI Chat Completions passthrough (also used for OPENAI_COMPATIBLE, Google via OpenAI compatibility, Mistral and Ollama through the configured providers).
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Provider response or SSE stream, content: { application/json: { schema: { type: object, additionalProperties: true } }, text/event-stream: { schema: { type: string } } } }
        '402': { $ref: '#/components/responses/Problem' }
  /llm/openai/v1/models:
    get:
      tags: [llm-proxy]
      operationId: proxyOpenAiModels
      security: [ { RunnerToken: [] } ]
      description: Lists only the models on the job's allowlist.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  # ---------------------------------------------------------------- fleet administration
  /admin/runner-pools:
    get:
      tags: [fleet]
      operationId: listRunnerPools
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RunnerPool' } } } } }
    post:
      tags: [fleet]
      operationId: createRunnerPool
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPoolInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPool' } } } }
  /admin/runner-pools/{poolId}:
    parameters: [ { name: poolId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [fleet]
      operationId: getRunnerPool
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPool' } } } }
    put:
      tags: [fleet]
      operationId: updateRunnerPool
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPoolInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunnerPool' } } } }
    delete:
      tags: [fleet]
      operationId: deleteRunnerPool
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/runner-pools/{poolId}/registration-tokens:
    parameters: [ { name: poolId, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [fleet]
      operationId: createRegistrationToken
      description: Single-use token for `runner-controller` registration (shown once, 24 h).
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { token: { type: string }, expiresAt: { type: string, format: date-time }, helmValues: { type: string, description: "ready-to-paste values for the back-office-runner chart (keys backOffice.url, backOffice.poolId, registration.token, backend)" } } } } } }
  /me/runner:
    get:
      tags: [fleet]
      operationId: getMyRunner
      description: 'ADR 0040: your personal runner pool (`fleet.personal`); 204 when you have not set one up.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalRunner' } } } }
        '204': { description: No personal runner }
    put:
      tags: [fleet]
      operationId: enableMyRunner
      description: Creates your personal runner pool (idempotent) or changes how Claude Code in it reaches the models.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalRunnerInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalRunner' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [fleet]
      operationId: disableMyRunner
      description: Deletes your personal runner pool and its runners; 409 while it has queued or running jobs.
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /me/runner/registration-tokens:
    post:
      tags: [fleet]
      operationId: createMyRunnerRegistrationToken
      description: Single-use registration token (24 h, shown once) for your personal runner and the docker run command that uses it.
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalRegistrationToken' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /me/runner/runners/{runnerId}:
    parameters: [ { name: runnerId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      tags: [fleet]
      operationId: revokeMyRunner
      description: Revokes a runner of your personal pool; its leased jobs are re-queued.
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/runners:
    get:
      tags: [fleet]
      operationId: listRunners
      parameters: [ { name: poolId, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Runner' } } } } }
  /admin/runners/{runnerId}:
    parameters: [ { name: runnerId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      tags: [fleet]
      operationId: revokeRunner
      description: Revokes the runner token; its leased jobs are re-queued.
      responses:
        '204': { description: Revoked }
  /admin/agent-jobs:
    get:
      tags: [fleet]
      operationId: listAgentJobs
      parameters:
        - { name: sort, in: query, schema: { type: string, pattern: '^[a-zA-Z]+\.(asc|desc)$' }, description: 'ADR 0046 column sort, field.asc or field.desc; fields: status, label, model, pool, duration, cost, queuedAt. Without it the natural order (newest first).' }
        - { name: poolId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AgentJobStatus' } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentJobPage' } } } }
  /admin/agent-jobs/{jobId}:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [fleet]
      operationId: getAgentJob
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AgentJob' } } } }
  /admin/agent-jobs/{jobId}/cancel:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [fleet]
      operationId: cancelAgentJob
      responses:
        '202': { description: Cancellation requested }
  /admin/operations/work-items:
    get:
      tags: [operations]
      operationId: listWorkItems
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [READY, LEASED, DONE, DEAD] } }
        - { name: kind, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemPage' } } } }
  /admin/operations/work-items/{itemId}/retry:
    parameters: [ { name: itemId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [operations]
      operationId: retryWorkItem
      responses:
        '202': { description: Re-queued }
  /admin/operations/overview:
    get:
      tags: [operations]
      operationId: getOperationsOverview
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsOverview' } } } }
  /projects/{projectId}/sandbox-policy:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [fleet]
      operationId: getProjectSandboxPolicy
      responses:
        '200': { description: 'Project policy plus the effective (resolved) policy', content: { application/json: { schema: { $ref: '#/components/schemas/SandboxPolicyView' } } } }
    put:
      tags: [fleet]
      operationId: updateProjectSandboxPolicy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxPolicy' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SandboxPolicyView' } } } }
        '400': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- budgets, insights, provenance (ADR 0025)
  /budgets:
    get:
      tags: [budgets]
      operationId: listBudgets
      description: Platform budget (for admins) and budgets of the caller's projects with current spend.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BudgetStatus' } } } } }
  /admin/budget:
    put:
      tags: [budgets]
      operationId: setPlatformBudget
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetStatus' } } } }
  /projects/{projectId}/budget:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [budgets]
      operationId: getProjectBudget
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetStatus' } } } }
    put:
      tags: [budgets]
      operationId: setProjectBudget
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetStatus' } } } }
  /insights/delivery:
    get:
      tags: [insights]
      operationId: getDeliveryInsights
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid }, description: 'omit for all visible projects' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryInsights' } } } }
  /insights/workflows:
    get:
      tags: [insights]
      operationId: getWorkflowInsights
      description: >
        Effectiveness and efficiency of one library workflow (`libraryWorkflowId`, needs `library.view`; runs of every
        project the caller may view) or of one project workflow (`workflowId`, needs `project.view`). Exactly one of the two.
        Scope: runs created in `[from, to)` (default the last 30 days, at most 366 days). Definitions: docs/architecture/11-governance.md.
      parameters:
        - { name: libraryWorkflowId, in: query, schema: { type: string, format: uuid } }
        - { name: workflowId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInsights' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /insights/library-workflows:
    get:
      tags: [insights]
      operationId: getLibraryWorkflowMetrics
      description: The headline metrics of every library workflow with runs in `[from, to)` of the projects the caller may view (`library.view`).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibraryWorkflowMetricsRow' } } } } }
  /runs/{runId}/attestations:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    get:
      tags: [provenance]
      operationId: listRunAttestations
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttestationSummary' } } } } }
  /attestations/{attestationId}:
    parameters: [ { name: attestationId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [provenance]
      operationId: getAttestation
      responses:
        '200': { description: DSSE envelope, content: { application/vnd.in-toto+json: { schema: { $ref: '#/components/schemas/DsseEnvelope' } } } }
  /attestations/verify:
    post:
      tags: [provenance]
      operationId: verifyAttestation
      description: Verifies a DSSE envelope against the published keys and returns the decoded statement.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DsseEnvelope' } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, keyId: { type: string, nullable: true }, statement: { type: object, additionalProperties: true }, reason: { type: string, nullable: true } } } } } }
  /.well-known/back-office/keys:
    servers: [ { url: / } ]
    get:
      tags: [provenance]
      operationId: getSigningKeys
      security: []
      description: Public JWK set (OKP / Ed25519) of the platform signing keys, current and retired (`status`). Unauthenticated.
      responses:
        '200': { description: JWK set, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object, properties: { kty: { type: string, example: OKP }, crv: { type: string, example: Ed25519 }, x: { type: string }, kid: { type: string }, use: { type: string }, alg: { type: string }, status: { type: string, enum: [active, retired] }, fingerprint: { type: string } } } } } } } } }

  # ---------------------------------------------------------------- personal access tokens
  /tokens:
    get:
      tags: [tokens]
      operationId: listMyTokens
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonalToken' } } } } }
    post:
      tags: [tokens]
      operationId: createMyToken
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalTokenInput' } } } }
      responses:
        '201': { description: Created (plaintext shown once), content: { application/json: { schema: { $ref: '#/components/schemas/PersonalTokenCreated' } } } }
  /tokens/{tokenId}:
    parameters: [ { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      tags: [tokens]
      operationId: revokeMyToken
      responses:
        '204': { description: Revoked }

  # ---------------------------------------------------------------- administration
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      parameters:
        - { name: sort, in: query, schema: { type: string, pattern: '^[a-zA-Z]+\.(asc|desc)$' }, description: 'ADR 0046 column sort, field.asc or field.desc; fields: name, email, status, lastLoginAt. Without it the natural order (newest first).' }
        - { name: q, in: query, schema: { type: string }, description: 'search in e-mail and name' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
    post:
      tags: [admin]
      operationId: inviteUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserInvite' } } } }
      responses:
        '201': { description: Invited, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    get:
      tags: [admin]
      operationId: getUser
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
    put:
      tags: [admin]
      operationId: updateUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
  /admin/users/{userId}/activate:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    post:
      tags: [admin]
      operationId: activateUser
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
  /admin/users/{userId}/deactivate:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    post:
      tags: [admin]
      operationId: deactivateUser
      description: Deletes all sessions and revokes personal tokens of the user. Cannot target yourself or the last platform admin (409).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/effective-permissions:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    get:
      tags: [admin]
      operationId: getEffectivePermissions
      description: Per permission the System | Group(s) | User | Effective breakdown, plus project roles.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EffectivePermissions' } } } }
  /admin/users/{userId}/sessions:
    parameters: [ { $ref: '#/components/parameters/userId' } ]
    get:
      tags: [admin]
      operationId: listUserSessions
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } } } } }
    delete:
      tags: [admin]
      operationId: terminateUserSessions
      responses:
        '204': { description: All sessions of the user terminated }
  /admin/groups:
    get:
      tags: [admin]
      operationId: listGroups
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Group' } } } } }
    post:
      tags: [admin]
      operationId: createGroup
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
  /admin/groups/{groupId}:
    parameters: [ { $ref: '#/components/parameters/groupId' } ]
    get:
      tags: [admin]
      operationId: getGroup
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
    put:
      tags: [admin]
      operationId: updateGroup
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
    delete:
      tags: [admin]
      operationId: deleteGroup
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      parameters: [ { name: scope, in: query, schema: { $ref: '#/components/schemas/PermissionScope' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } }
    post:
      tags: [admin]
      operationId: createRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/roles/{roleKey}:
    parameters: [ { name: roleKey, in: path, required: true, schema: { type: string } } ]
    put:
      tags: [admin]
      operationId: updateRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
    delete:
      tags: [admin]
      operationId: deleteRole
      description: Built-in roles cannot be deleted (409).
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/permissions:
    get:
      tags: [admin]
      operationId: getPermissionCatalog
      description: The catalogue contributed by all modules.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PermissionDefinition' } } } } }
  /admin/grants:
    get:
      tags: [admin]
      operationId: listGrants
      parameters:
        - { name: level, in: query, schema: { $ref: '#/components/schemas/GrantLevel' } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GrantSet' } } } } }
    put:
      tags: [admin]
      operationId: replaceGrants
      description: Replaces the platform grants and role assignments of one target (SYSTEM, a group or a user).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantSet' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GrantSet' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/settings:
    get:
      tags: [admin]
      operationId: getPlatformSettings
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSettings' } } } }
    put:
      tags: [admin]
      operationId: updatePlatformSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSettings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSettings' } } } }
  /admin/audit:
    get:
      tags: [audit]
      operationId: searchAuditLog
      description: Keyset-paginated; the search itself is recorded as AUDIT_VIEW.
      parameters:
        - { name: sort, in: query, schema: { type: string, pattern: '^[a-zA-Z]+\.(asc|desc)$' }, description: 'ADR 0046 column sort, field.asc or field.desc; fields: at (the log stays chronological; at.asc lists the oldest first). Without it the natural order (newest first).' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: operation, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCESS, DENIED, FAILURE] } }
        - { name: correlationId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
  /users/lookup:
    get:
      tags: [members]
      operationId: lookupUsers
      description: Minimal user search for pickers; needs `project.members.manage` on any project or `admin.users.view`.
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 2 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserRef' } } } } }
  /groups/lookup:
    get:
      tags: [members]
      operationId: lookupGroups
      description: Minimal group search for pickers; same permission as user lookup.
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } } } } }

  # ---------------------------------------------------------------- project members
  /projects/{projectId}/members:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [members]
      operationId: listProjectMembers
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } } }
    post:
      tags: [members]
      operationId: addProjectMember
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectMemberInput' } } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectMember' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/members/{memberId}:
    parameters: [ { $ref: '#/components/parameters/projectId' }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [members]
      operationId: changeProjectMemberRole
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectMember' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [members]
      operationId: removeProjectMember
      description: The last owner cannot be removed (409).
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- projects
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
    post:
      tags: [projects]
      operationId: createProject
      description: Also creates the default workflows "Issue to reviewed MR" and "CI code review" and the `code-review` CI entrypoint.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /projects/{projectId}:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
    put:
      tags: [projects]
      operationId: updateProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses:
        '204': { description: Deleted }
  /projects/{projectId}/spec-kit:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [projects]
      operationId: getProjectSpecKit
      description: 'ADR 0036 (`project.view`): the Spec Kit setting, the platform switch and the seeded Spec Kit workflows the project lacks.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SpecKitStatus' } } } }
  /projects/{projectId}/spec-kit/workflows:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [projects]
      operationId: addSpecKitWorkflows
      description: >
        ADR 0036 "Add Spec Kit workflows" (`workflow.edit`): seeds the Spec Kit workflows the project lacks. Needs Spec
        Kit on for the project and the platform and at least one repository (409 otherwise). Audited `PROJECT_SPEC_KIT_SEEDED`.
      responses:
        '200': { description: The workflows that were added, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkflowDefinition' } } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/ci-entrypoints:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [projects]
      operationId: listCiEntrypoints
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CiEntrypoint' } } } } }
    put:
      tags: [projects]
      operationId: replaceCiEntrypoints
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CiEntrypoint' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CiEntrypoint' } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/ci-tokens:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [ci-tokens]
      operationId: listCiTokens
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CiToken' } } } } }
    post:
      tags: [ci-tokens]
      operationId: createCiToken
      description: Returns the plaintext token exactly once.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CiTokenCreated' } } } }
  /projects/{projectId}/ci-tokens/{tokenId}:
    parameters: [ { $ref: '#/components/parameters/projectId' }, { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete:
      tags: [ci-tokens]
      operationId: revokeCiToken
      responses:
        '204': { description: Revoked }
  /projects/{projectId}/ci-snippet:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [projects]
      operationId: getCiSnippet
      description: Ready-to-paste `.gitlab-ci.yml` include and variables for this project.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { gitlabCi: { type: string }, scriptUrl: { type: string }, variables: { type: array, items: { type: string } } } } } } }

  # ---------------------------------------------------------------- workflows
  /projects/{projectId}/workflows:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [workflows]
      operationId: listWorkflows
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkflowDefinition' } } } } }
    post:
      tags: [workflows]
      operationId: createWorkflow
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinitionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
    put:
      tags: [workflows]
      operationId: updateWorkflow
      description: Bumps `version`; in-flight runs keep their pinned version. A definition with validation errors is saved as a draft (`draft`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinitionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workflows]
      operationId: deleteWorkflow
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/duplicate:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    post:
      tags: [workflows]
      operationId: duplicateWorkflow
      responses:
        '201': { description: Copy created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
  /workflows/validate:
    post:
      tags: [workflows]
      operationId: validateWorkflow
      parameters: [ { name: projectId, in: query, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinitionInput' } } } }
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResult' } } } }
  /workflows/palette:
    get:
      tags: [workflows]
      operationId: getWorkflowPalette
      description: Control nodes and concrete task templates (grouped by interface) available to the designer for a project.
      parameters: [ { name: projectId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowPalette' } } } }
  /workflows/model-options:
    get:
      tags: [workflows]
      operationId: getModelOptions
      description: >-
        ADR 0050: the models a step of the project may use for the caller, usable ones first: route (GATEWAY or
        OWN_LOGIN), whether it is personal, and why a model cannot be used. Needs project.view.
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: stepKind, in: query, required: true, schema: { $ref: '#/components/schemas/StepKind' } }
        - { name: harness, in: query, required: false, schema: { type: string, enum: [OPENCODE, CLAUDE_CODE] }, description: 'coding agent of a CODING_AGENT step' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelOption' } } } } }
  /workflows/{workflowId}/model-plan:
    get:
      tags: [workflows]
      operationId: getWorkflowModelPlan
      description: >-
        ADR 0050: the model of every task step as a run would resolve it (node, template, project default or review
        default) and whether the caller can use it; a step with a problem stops a run from starting. Needs project.view.
      parameters: [ { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StepModelPlan' } } } } }
  /workflows/expressions/validate:
    post:
      tags: [workflows]
      operationId: validateExpression
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expression], properties: { expression: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, message: { type: string, nullable: true } } } } } }
  /workflows/{workflowId}/runs:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    post:
      tags: [runs]
      operationId: startRun
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StartRunRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }

  # ---------------------------------------------------------------- workflow library (ADR 0037)
  /projects/{projectId}/workspaces:
    parameters: [ { name: projectId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [project-workspaces]
      operationId: listProjectWorkspaces
      description: 'Run workspaces of the project (project.view; ADR 0044).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectWorkspace' } } } } }
    post:
      tags: [project-workspaces]
      operationId: createProjectWorkspace
      description: 'Adds a run workspace (project.manage). Sources must be repositories of the project or library sources.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectWorkspaceInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectWorkspace' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/workspaces/{workspaceId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [project-workspaces]
      operationId: updateProjectWorkspace
      description: 'Changes a workspace (project.manage); the key cannot change because workflow steps refer to it.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectWorkspaceInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectWorkspace' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [project-workspaces]
      operationId: deleteProjectWorkspace
      description: 'Removes a workspace (project.manage). Steps that still name it fail validation and are kept as drafts.'
      responses:
        '204': { description: Deleted }
  /library/sources:
    get:
      tags: [library-sources]
      operationId: listLibrarySources
      description: 'Sources of the library (library.view).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibrarySource' } } } } }
    post:
      tags: [library-sources]
      operationId: createLibrarySource
      description: 'Adds a git source to the library (library.manage).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibrarySourceInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LibrarySource' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /library/sources/{sourceId}:
    parameters: [ { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [library-sources]
      operationId: getLibrarySource
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LibrarySource' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [library-sources]
      operationId: updateLibrarySource
      description: 'Changes a source (library.manage); the key cannot change because steps refer to it.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibrarySourceInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LibrarySource' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [library-sources]
      operationId: deleteLibrarySource
      description: 'Removes a source (library.manage). Steps that still name it fail validation and are kept as drafts.'
      responses:
        '204': { description: Deleted }
  /library/workflows:
    get:
      tags: [workflow-library]
      operationId: listLibraryWorkflows
      description: Library workflows (`library.view`). Usage counts only cover projects the caller may view.
      parameters:
        - { name: includeDeprecated, in: query, schema: { type: boolean, default: true } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibraryWorkflowSummary' } } } } }
  /library/workflows/{libraryWorkflowId}:
    parameters: [ { $ref: '#/components/parameters/libraryWorkflowId' } ]
    get:
      tags: [workflow-library]
      operationId: getLibraryWorkflow
      description: The entry with its versions and the linked project workflows the caller may view (`library.view`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryWorkflow' } } } }
    put:
      tags: [workflow-library]
      operationId: updateLibraryWorkflow
      description: Name, description, tags and the deprecated flag (`library.manage`). Versions are immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryWorkflowUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryWorkflow' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workflow-library]
      operationId: deleteLibraryWorkflow
      description: '`library.manage`; refused (409) while any project workflow is linked to the entry: deprecate it instead.'
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /library/workflows/{libraryWorkflowId}/versions/{version}:
    parameters:
      - { $ref: '#/components/parameters/libraryWorkflowId' }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [workflow-library]
      operationId: getLibraryWorkflowVersion
      description: One published version with its graph (`library.view`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryWorkflowVersionDetail' } } } }
  /workflows/{workflowId}/publish:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    post:
      tags: [workflow-library]
      operationId: publishWorkflow
      description: >
        Publishes the saved project workflow to the library as a new entry (`libraryWorkflowId` null, `key` and `name`
        required) or as the next version of an existing entry. Needs `library.manage` and `workflow.edit` on the
        project. Project-local settings (step repositories, a pinned Jira connection, named approver users) are not
        published. Steps must use global task templates. The project workflow becomes linked to the new version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishWorkflowRequest' } } } }
      responses:
        '201': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryWorkflow' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/workflows/from-library:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [workflow-library]
      operationId: adoptLibraryWorkflow
      description: Creates a project workflow linked to a library version (default the latest); `workflow.edit` on the project and `library.view`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdoptLibraryWorkflowRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/library/update:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    post:
      tags: [workflow-library]
      operationId: updateWorkflowFromLibrary
      description: >
        Replaces the graph of a linked workflow with a library version (default the latest) and keeps the project-local
        settings of nodes with the same id, the name, triggers, enabled flag and viewport (`workflow.edit`). A locally
        modified copy is refused with 409 unless `discardLocalChanges` is true.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryUpdateRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/library/detach:
    parameters: [ { $ref: '#/components/parameters/workflowId' } ]
    post:
      tags: [workflow-library]
      operationId: detachWorkflowFromLibrary
      description: Removes the library link; the graph stays (`workflow.edit`). Runs keep the library version they ran.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }

  # ---------------------------------------------------------------- runs
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - { name: sort, in: query, schema: { type: string, pattern: '^[a-zA-Z]+\.(asc|desc)$' }, description: 'ADR 0046 column sort, field.asc or field.desc; fields: status, workflow, project, startedBy, cost, createdAt. Without it the natural order (newest first).' }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: workflowId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/RunStatus' } }, style: form, explode: false }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRunPage' } } } }
  /runs/{runId}:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }
  /runs/{runId}/artifacts:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    get:
      tags: [runs]
      operationId: listRunArtifacts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArtifactSummary' } } } } }
  /runs/{runId}/artifacts/{artifactId}:
    parameters: [ { $ref: '#/components/parameters/runId' }, { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [runs]
      operationId: getRunArtifact
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
  /runs/{runId}/logs:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    get:
      tags: [runs]
      operationId: getRunLogs
      parameters:
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LogLine' } } } } }
  /runs/{runId}/cancel:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    post:
      tags: [runs]
      operationId: cancelRun
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /runs/{runId}/retry:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    post:
      tags: [runs]
      operationId: retryRun
      description: >-
        Retries a FAILED run from its failing node. A node that used up its maxVisits (the failing step or the gate of its
        retry loop) gets that many attempts more. An optional comment reaches the retried step as {{feedback}}, like a
        gate's revise comment. Audited RUN_RETRY.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, nullable: true, maxLength: 4000, description: what the retried step should do differently }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /runs/{runId}/signals:
    parameters: [ { $ref: '#/components/parameters/runId' } ]
    post:
      tags: [runs]
      operationId: signalRunManually
      description: Owner-side equivalent of a CI signal (e.g. to unblock a WAIT_FOR_CI node by hand).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualSignal' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowRun' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- approvals
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, DECIDED, EXPIRED], default: OPEN } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } } } } }
  /approvals/{approvalId}:
    parameters: [ { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [approvals]
      operationId: getApproval
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
  /approvals/{approvalId}/decide:
    parameters: [ { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [approvals]
      operationId: decideApproval
      description: >
        Decides a human gate or a write confirmation (ADR 0033). A write confirmation (`kind: WRITE_CONFIRMATION`) offers
        `approve` and `reject` only and cannot edit artefacts: approve performs exactly the previewed `write`, reject
        writes nothing and the step leaves through its `failure` port. Audited `RUN_GATE_DECIDED` / `RUN_WRITE_DECIDED`.
        ADR 0035: `writeAs` (SYSTEM / PERSONAL) chooses who writes; PERSONAL needs a fitting personal connection of the
        approver (409 otherwise) and a step that allows it (400 otherwise).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: Decided; run resumes, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /approvals/{approvalId}/write-identity:
    parameters: [ { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [approvals]
      operationId: getWriteIdentity
      description: >
        ADR 0035 (`project.view`): which identities the CALLER could approve this write confirmation as: the step's system
        (or pinned) connection and/or the caller's own personal connection. Reveals only the caller's own connection.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WriteIdentity' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /approvals/{approvalId}/assignees:
    parameters: [ { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [approvals]
      operationId: assignApproval
      description: |
        Needs `run.assign` on the project (owners and maintainers; ADR 0028). Sets who decides this OPEN approval,
        replacing the gate's `approvers.users` for this approval only; an empty list clears the assignment. Every
        assignee must be an active user holding `run.approve` on the project who satisfies the gate's roles rule and
        four-eyes rule (400 otherwise). Audited as `APPROVAL_ASSIGN` (old/new), published as `ApprovalAssigned`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignApproval' } } } }
      responses:
        '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /approvals/{approvalId}/assignee-candidates:
    parameters: [ { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [approvals]
      operationId: listAssigneeCandidates
      description: Needs `run.assign`. Project members (direct or through a group) who could decide this approval if assigned.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssigneeCandidate' } } } } }
        '403': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- CI (project token)
  /ci/executions:
    post:
      tags: [ci]
      operationId: startCiExecution
      security: [ { CiToken: [] } ]
      description: |
        Called by `backoffice-ci run <entrypoint>`. Starts the workflow mapped to the entrypoint with the CI
        context as run input; the diff (if any) becomes the artefact `diff`. Idempotent per
        (project, entrypoint, commitSha, mergeRequest.iid) for 24 h unless `variables.force == "true"`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CiExecutionRequest' } } } }
      responses:
        '202': { description: Queued or existing, content: { application/json: { schema: { $ref: '#/components/schemas/CiExecution' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [ci]
      operationId: listCiExecutions
      description: Listing for users with `project.view` (filtered to their projects).
      parameters:
        - { name: sort, in: query, schema: { type: string, pattern: '^[a-zA-Z]+\.(asc|desc)$' }, description: 'ADR 0046 column sort, field.asc or field.desc; fields: status, entrypoint, ref, project, cost, createdAt. Without it the natural order (newest first).' }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CiExecutionPage' } } } }
