{{- if .Values.externalSecrets.enabled }}
{{- /*
External Secrets Operator (external-secrets.io/v1). Every Secret the chart would otherwise render is
materialised from the secret store instead. Each remote secret is a key/value map whose keys are the
environment variable names (docs/guides/configuration.md, "Helm secrets layout"), read with
dataFrom.extract. The chart's own Secrets are not rendered while this is on.
*/ -}}
{{- $root := . }}
{{- $es := .Values.externalSecrets }}
{{- $targets := list }}
{{- $targets = append $targets (dict "name" (include "back-office.appSecretName" .) "cfg" $es.app "component" "api") }}
{{- $targets = append $targets (dict "name" (include "back-office.providerKeysSecretName" .) "cfg" $es.providerKeys "component" "api") }}
{{- $targets = append $targets (dict "name" (include "back-office.integrationsSecretName" .) "cfg" $es.integrations "component" "api") }}
{{- if and (eq (include "back-office.database.mode" .) "external") (not .Values.externalDatabase.existingSecret) }}
{{- $targets = append $targets (dict "name" (printf "%s-db" (include "back-office.fullname" .)) "cfg" $es.database "component" "database") }}
{{- end }}
{{- if $es.storage.enabled }}
{{- $targets = append $targets (dict "name" (printf "%s-storage" (include "back-office.fullname" .)) "cfg" $es.storage "component" "storage") }}
{{- end }}
{{- if and $es.signing.enabled (not .Values.signing.existingSecret) }}
{{- $targets = append $targets (dict "name" (include "back-office.signing.secretName" .) "cfg" $es.signing "component" "signing") }}
{{- end }}
{{- range $i, $t := $targets }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $t.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "back-office.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $t.component }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ $t.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- if $t.cfg.data }}
  data:
    {{- toYaml $t.cfg.data | nindent 4 }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ required (printf "externalSecrets: remoteKey is required for %s" $t.name) $t.cfg.remoteKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
