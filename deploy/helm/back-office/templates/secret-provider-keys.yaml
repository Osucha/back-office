{{- if and (not .Values.externalSecrets.enabled) (.Values.secrets.providerKeys.create) }}
{{- $p := .Values.secrets.providerKeys }}
apiVersion: v1
kind: Secret
metadata:
  # Consumed by api/worker only; sandboxes use the LLM gateway with a job token (ADR 0024).
  name: {{ include "back-office.providerKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- with $p.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $p.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $p.googleGenaiApiKey }}
  GOOGLE_GENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $p.mistralApiKey }}
  MISTRAL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $p.openaiCompatibleApiKey }}
  OPENAI_COMPATIBLE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $p.openaiCompatibleBaseUrl }}
  OPENAI_COMPATIBLE_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $p.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
