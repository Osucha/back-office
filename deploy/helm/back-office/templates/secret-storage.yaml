{{- /* S3 credentials: inline values or generated for the bundled MinIO. Absent with existingSecret, External
Secrets, or ambient cloud credentials (IRSA / GKE Workload Identity: leave accessKey empty). */ -}}
{{- if and (not .Values.storage.s3.existingSecret) (not (and .Values.externalSecrets.enabled .Values.externalSecrets.storage.enabled)) (or .Values.minio.enabled .Values.storage.s3.accessKey) }}
{{- $name := printf "%s-storage" (include "back-office.fullname" .) }}
{{- $access := .Values.storage.s3.accessKey }}
{{- $secretKey := .Values.storage.s3.secretKey }}
{{- if and .Values.minio.enabled (not $access) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "BACKOFFICE_STORAGE_S3_ACCESS_KEY") }}
{{- $access = index $existing.data "BACKOFFICE_STORAGE_S3_ACCESS_KEY" | b64dec }}
{{- $secretKey = index $existing.data "BACKOFFICE_STORAGE_S3_SECRET_KEY" | b64dec }}
{{- else }}
{{- $access = printf "backoffice%s" (randAlphaNum 8 | lower) }}
{{- $secretKey = randAlphaNum 40 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  BACKOFFICE_STORAGE_S3_ACCESS_KEY: {{ $access | quote }}
  BACKOFFICE_STORAGE_S3_SECRET_KEY: {{ required "storage.s3.secretKey is required with storage.s3.accessKey" $secretKey | quote }}
{{- end }}
