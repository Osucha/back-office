{{- if .Values.keycloak.enabled }}
{{- /*
Resources around the bundled Keycloak (codecentric/keycloakx, alias `keycloak`). Names use only
.Release.Name because the subchart references them from its own (templated) values.
*/ -}}
{{- $envName := printf "%s-keycloak-env" .Release.Name }}
{{- $adminPassword := .Values.bundledKeycloak.admin.password }}
{{- if not $adminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $envName }}
{{- if and $existing $existing.data (hasKey $existing.data "KC_BOOTSTRAP_ADMIN_PASSWORD") }}
{{- $adminPassword = index $existing.data "KC_BOOTSTRAP_ADMIN_PASSWORD" | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- $dbPassword := include "back-office.keycloak.dbPassword" . }}
{{- if and (not $dbPassword) (not .Values.keycloak.database.existingSecret) }}
{{- fail "keycloak.enabled=true: the database password is in an existing Secret, set keycloak.database.existingSecret and keycloak.database.existingSecretKey so Keycloak can read it" }}
{{- end }}
# Environment of the Keycloak pod (envFrom in values.yaml keycloak.extraEnvFrom).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $envName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  # Public URL (hostname v2): issuer = <KC_HOSTNAME>/realms/<realm> for browser and API alike.
  KC_HOSTNAME: {{ include "back-office.keycloak.url" . | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.bundledKeycloak.admin.username | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  # Keycloak shares the Back Office PostgreSQL, in its own schema (created by Keycloak on first start).
  KC_DB: postgres
  KC_DB_URL_HOST: {{ include "back-office.database.host" . | quote }}
  KC_DB_URL_PORT: {{ include "back-office.database.port" . | quote }}
  KC_DB_URL_DATABASE: {{ include "back-office.database.name" . | quote }}
  KC_DB_USERNAME: {{ include "back-office.database.username" . | quote }}
  KC_DB_SCHEMA: {{ .Values.bundledKeycloak.database.schema | quote }}
  {{- with $dbPassword }}
  KC_DB_PASSWORD: {{ . | quote }}
  {{- end }}
---
{{- /* Realm import, parameterised from deploy/keycloak/realm-back-office.json (copy in files/, CI checks they are identical). */ -}}
{{- $realm := .Files.Get "files/keycloak/realm-back-office.json" | fromJson }}
{{- $publicUrl := include "back-office.publicUrl" . | trimSuffix "/" }}
{{- $_ := set $realm "realm" (include "back-office.keycloak.realm" .) }}
{{- $_ := set $realm "displayName" "Back Office" }}
{{- $_ := set $realm "sslRequired" .Values.bundledKeycloak.realmImport.sslRequired }}
{{- if not .Values.bundledKeycloak.realmImport.includeDemoUsers }}
{{- $_ := unset $realm "users" }}
{{- end }}
{{- range $client := $realm.clients }}
{{- if eq $client.clientId "back-office" }}
{{- $_ := set $client "clientId" $.Values.auth.oidc.clientId }}
{{- $_ := set $client "secret" (include "back-office.keycloak.clientSecret" $) }}
{{- $_ := set $client "baseUrl" (printf "%s/" $publicUrl) }}
{{- $_ := set $client "redirectUris" (concat (list (printf "%s/login/oauth2/code/oidc" $publicUrl)) $.Values.bundledKeycloak.realmImport.extraRedirectUris) }}
{{- $_ := set $client.attributes "post.logout.redirect.uris" (printf "%s/*" $publicUrl) }}
{{- end }}
{{- end }}
# Realm imported by `kc.sh start --import-realm` on the first start (existing realms are skipped).
# A Secret, not a ConfigMap: it carries the client secret and, optionally, demo user passwords.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-keycloak-realm" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  realm-back-office.json: |
    {{- $realm | toPrettyJson | nindent 4 }}
{{- if .Values.bundledKeycloak.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "back-office.keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.bundledKeycloak.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.bundledKeycloak.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.bundledKeycloak.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.bundledKeycloak.ingress.host | quote }}
      http:
        paths:
          # The admin console (/admin) is exposed too; restrict it at the ingress controller if needed.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "back-office.keycloak.service" . }}
                port:
                  name: http
{{- end }}
{{- end }}
