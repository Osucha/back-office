{{- /* Iteration 3 removed the API keys (ADR 0016). Fail loudly instead of silently ignoring old values. */ -}}
{{- if or .Values.secrets.apiKey .Values.secrets.ciApiKey }}
{{- fail "secrets.apiKey / secrets.ciApiKey were removed in iteration 3: users log in through OIDC (auth.oidc.*), the first admin comes from auth.bootstrapAdmins, CI uses project CI tokens. Remove them from your values (docs/guides/deploy-helm.md, Upgrading from iteration 2)." }}
{{- end }}
{{- if and (not .Values.externalSecrets.enabled) (.Values.secrets.create) }}
{{- $name := include "back-office.appSecretName" . }}
{{- /* Keep a generated runner token secret stable across upgrades. */ -}}
{{- $runnerSecret := .Values.secrets.runnerTokenSecret }}
{{- if not $runnerSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "RUNNER_TOKEN_SECRET") }}
{{- $runnerSecret = index $existing.data "RUNNER_TOKEN_SECRET" | b64dec }}
{{- else }}
{{- $runnerSecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
{{- /* Local-account secret key (ADR 0021): base64 of 32 random bytes, stable across upgrades. */ -}}
{{- $localKey := .Values.auth.local.secretKey }}
{{- if not $localKey }}
{{- $existingApp := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existingApp $existingApp.data (hasKey $existingApp.data "BACKOFFICE_AUTH_LOCAL_SECRET_KEY") }}
{{- $localKey = index $existingApp.data "BACKOFFICE_AUTH_LOCAL_SECRET_KEY" | b64dec }}
{{- else }}
{{- $localKey = randBytes 32 }}
{{- end }}
{{- end }}
{{- /* Connection secrets key (ADR 0030): base64 of 32 random bytes, stable across upgrades; losing it loses every connection token. */ -}}
{{- $connectionsKey := .Values.secrets.connectionsKey }}
{{- if not $connectionsKey }}
{{- $existingKeys := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existingKeys $existingKeys.data (hasKey $existingKeys.data "BACKOFFICE_SECRETS_KEY") }}
{{- $connectionsKey = index $existingKeys.data "BACKOFFICE_SECRETS_KEY" | b64dec }}
{{- else }}
{{- $connectionsKey = randBytes 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  RUNNER_TOKEN_SECRET: {{ $runnerSecret | quote }}
  BACKOFFICE_AUTH_LOCAL_SECRET_KEY: {{ $localKey | quote }}
  BACKOFFICE_SECRETS_KEY: {{ $connectionsKey | quote }}
  {{- if .Values.secrets.connectionsPreviousKeys }}
  BACKOFFICE_SECRETS_PREVIOUS_KEYS: {{ .Values.secrets.connectionsPreviousKeys | quote }}
  {{- end }}
  {{- if .Values.auth.local.bootstrapAdminPassword }}
  BACKOFFICE_AUTH_LOCAL_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.auth.local.bootstrapAdminPassword | quote }}
  {{- end }}
  {{- if and (not .Values.auth.oidc.existingSecret) (include "back-office.oidc.issuerUri" .) }}
  BACKOFFICE_AUTH_OIDC_CLIENT_SECRET: {{ required "auth.oidc.clientSecret or auth.oidc.existingSecret is required (OIDC client secret of the API)" .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- if include "back-office.database.inlinePassword" . }}
  SPRING_DATASOURCE_PASSWORD: {{ required "externalDatabase.password or externalDatabase.existingSecret is required for an external database" .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and .Values.langfuse.enabled (not .Values.langfuseAuth.existingSecret) }}
  {{- if and .Values.langfuseAuth.publicKey .Values.langfuseAuth.secretKey }}
  OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION: {{ printf "Basic %s" (printf "%s:%s" .Values.langfuseAuth.publicKey .Values.langfuseAuth.secretKey | b64enc) | quote }}
  {{- end }}
  {{- else if and .Values.otel.enabled .Values.otel.headersAuthorization }}
  OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION: {{ .Values.otel.headersAuthorization | quote }}
  {{- end }}
{{- end }}
