{{- if .Values.secrets.integrations.gitToken }}
{{- fail "secrets.integrations.gitToken was removed: the control plane never uses git credentials. Put the token into the runner cluster (chart back-office-runner, gitCredentials.existingSecret, key token; docs/guides/runner-fleet-install.md) and remove it from your values." }}
{{- end }}
{{- if and (not .Values.externalSecrets.enabled) (.Values.secrets.integrations.create) }}
{{- $i := .Values.secrets.integrations }}
apiVersion: v1
kind: Secret
metadata:
  # Consumed by api/worker (envFrom).
  name: {{ include "back-office.integrationsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "back-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- include "back-office.annotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- with $i.jiraApiToken }}
  JIRA_API_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
